<!doctype html><html><head><meta charset="utf-8"></head><body>
<div class="login-error-div"><div class="login-error-msg">Nome de usuário ou senha inválida. Verifique seus dados e tente novamente.</div></div>
<form id="kc-form-login" action="#" method="post" onsubmit="login.disabled = true; return true;">

                <div class="form-group">
                    <label for="username">CPF <span>*</span></label>
                    <input id="username" type="text" name="username" class="form-control" value="" autofocus="" autocomplete="off" aria-invalid="true" inputmode="text">
                </div>

                <div class="form-group">
                    <label for="password">Senha <span>*</span></label>
                    <input id="password" name="password" type="password" autocomplete="off" class="form-control pass-strengthpmfinputSecret" aria-invalid="true" value="">
                </div>


                <p>
                    <input type="hidden" id="id-hidden-input" name="credentialId">
                    <input class="btn btn-login" value="Entrar" alt="Entrar" id="botao-entrar" type="submit">
                </p>
            </form>
</body></html>
