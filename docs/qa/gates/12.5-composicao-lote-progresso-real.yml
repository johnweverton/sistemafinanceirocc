issues:
  - id: REL-125-1
    severity: medium
    category: code
    status: debito-registrado
    titulo: "Execução que termina em `erro` prende o diálogo pelo resto da vida da aba — o @dev fechou a porta do 404 e deixou a do `erro` aberta"
    description: >
      **Achado desta revisão, provado por sonda temporária que eu escrevi, rodei e apaguei** (não
      por leitura). O @dev encontrou sozinho, na autocrítica, que um rastro apontando para uma
      execução inexistente **prendia** o diálogo, e corrigiu — mas a correção é
      `execucaoQ.error instanceof ApiClientError && execucaoQ.error.status === 404`, com o
      comentário explicando que restringir a 404 é deliberado. O raciocínio do "só 404" está
      **certo** (falha de rede transitória não pode limpar um resultado que está na tela). O que
      ficou de fora é um estado que **não é transitório**: `status === 'erro'`.
      Rastreei as quatro condições que se combinam, todas na fonte:
      · o rastro só é apagado em `if (calculoConcluido) gravarLoteEmAndamento(null)` (`:335-337`) —
        e `calculoConcluido` é `status === 'concluido'`, ponto;
      · o botão de calcular está sob `{!execucaoId && …}` (`:417`) — não existe;
      · `CampoCompetencia` está `disabled={!!execucaoId}` (`:444`) — trocar de mês também não é
        saída;
      · o ramo de erro do `ProgressoExecucao` (`:106-110`) é **só um `<p role="alert">** ("A
        execução encontrou um erro. Tente reprocessar a competência.") — o botão **Reprocessar**
        existe **exclusivamente** no ramo `processando` + `travada`. A tela manda reprocessar e não
        oferece como.
      Resultado: só resta "Fechar" — e reabrir restaura o mesmo rastro, no mesmo estado. **A sonda
      confirmou os três fatos**: o rastro continua em `sessionStorage` depois do erro, a remontagem
      volta ao mesmo bloco de erro sem botão de calcular, e nenhum "Reprocessar" aparece.
      **Segunda porta, mesma família:** se `execucoesService.detalhe` falhar de forma **persistente**
      com algo que não seja 404 (500 do banco, por exemplo), os dois observers erram, `data` fica
      `undefined`, `calculoConcluido` é false, o `ProgressoExecucao` renderiza "Aguardando dados..."
      e o `refetchInterval` **não liga** — porque a condição é `q.state.data?.status ===
      'processando'` e `data` é `undefined`. Mesmo beco, sem nem a mensagem de erro.
      **Enquadramento justo, nas duas direções.** (a) **Não há perda de dado**: a execução existe no
      banco, aparece no histórico, e a saída é abrir uma aba nova (`sessionStorage` é por aba) — por
      isso `medium` e não `high`. (b) **Mas é uma regressão de recuperabilidade**: antes da 12.5 o
      `dispararPrimeiroLote` engolia o erro, a rota devolvia o id assim mesmo e o diálogo mostrava
      um resumo vazio — enganoso, porém **escapável**. A 12.5 troca informação boa (agora o erro é
      dito) por saída ruim. O saldo líquido continua positivo; o item é fechar a porta que sobrou.
    recommendation: >
      Uma linha, no mesmo efeito que já existe: apagar o rastro também quando o estado é **terminal
      e não recuperável** — `if (calculoConcluido || execucaoQ.data?.status === 'erro')
      gravarLoteEmAndamento(null)`. E, para dar saída de verdade (não só na próxima abertura), um
      botão "Começar um lote novo" que faça `setExecucaoId(null)` quando `execucaoQ.data?.status ===
      'erro'`. Duas asserções acompanham: (i) depois do erro o `sessionStorage` está limpo;
      (ii) remontar oferece o botão de calcular.
      **Roteamento:** `DEB-12.5-A` → **12.6** ("erro vs. vazio nos pontos de carga"), que é a dona
      declarada deste arquivo para tratamento de erro e já é a próxima da fila `RS-9`. **Exige
      acréscimo explícito do @po** à AC 1 **e** à File List da 12.6 — a AC 1 da 12.6 enumera 4
      pontos de carga e este estado **não é um deles**. Terceiro gate consecutivo em que peço
      acréscimo explícito para a 12.6 (ver DEB-12.4-B e OBS-123-4a, ambos ainda pendentes de @po).
      **Não abrir commit avulso** — arquivo em contenção `RS-9`.
