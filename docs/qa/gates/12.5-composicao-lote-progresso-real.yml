      teto, sobram 2 "Reprocessar" na mesma janela — a folga que ele descreve. Mas o pior caso é
      pior do que parece: o operador que estourou o minuto e recebe **429 no `retomar`** (não no
      lote) cai no toast genérico de `calcular.onError`, com a execução já **criada e em
