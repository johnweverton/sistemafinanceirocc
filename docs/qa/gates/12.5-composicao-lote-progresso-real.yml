    cobertura: "2 `it` novos em `ClientesContabilidadeManager.test.tsx` — o positivo (3 selecionados · 1 inativo · botão (2)) e o de ausência (sem inativos a barra não ganha texto)."
  AC3_progresso_real:
    status: ATENDIDO
    codigo: >
      `:629-631` renderiza `<ProgressoExecucao execucaoId rotulo="Calculando clientes contábeis" />`
      enquanto `!calculoConcluido`. Barra, `%`, `role="status"`/`aria-live`, limiar de travamento e
