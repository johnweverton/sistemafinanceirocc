  AC5_execucaoid_recuperavel:
    status: ATENDIDO
    codigo: >
      Sub-produto de [D-1] + `sessionStorage` chaveado (`CHAVE_LOTE_EM_ANDAMENTO`), restaurado em
      `useEffect` de montagem (`:112-120`, com o cuidado de hidratação correto — o servidor não tem
