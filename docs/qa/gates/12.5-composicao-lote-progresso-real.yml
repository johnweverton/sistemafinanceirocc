resumo_do_veredito: >
  **CONCERNS — e não é CONCERNS de desconfiança: os 6 ACs estão entregues e travados por teste
  discriminante.** Mutei o `src` em **5 pontos independentes** (AC 1-composição, AC 1-teto, AC 3/5,
  AC 4, AC 5-persistência) e em **5 de 5** falharam **exatamente** os testes correspondentes, nem um
  a mais nem um a menos. O débito herdado `DEB-12.4-A` está fechado nas **duas** metades que o gate
  da 12.4 prescreveu (comentário reescrito + Escape/backdrop asseridos, com o caso negativo de
  bônus). A decisão de arquitetura [D-1] (rota cria-e-responde + `retomar`) foi verificada na fonte
  e **procede**: `criarExecucao` grava `status: 'processando'` (`execucao-repository.ts:83`), que é
  exatamente o pré-requisito do guard de `retomar`, e os papéis das duas rotas são **idênticos**
  (`['admin','colaborador']`) — não há o 403-no-meio-do-fluxo que eu procurei.
  O que segura o PASS são **dois `medium`**, ambos achados meus e nenhum deles "falta de AC":
  (1) **REL-125-1** — a mesma classe de beco sem saída que o próprio @dev encontrou e corrigiu para
  o 404 continua **aberta para `status === 'erro'`**: o rastro em `sessionStorage` só é apagado em
  `concluido`, o botão de calcular some com `!execucaoId`, o `CampoCompetencia` fica
  `disabled={!!execucaoId}` e o ramo de erro do `ProgressoExecucao` **não tem botão de Reprocessar**.
  Fechar e reabrir restaura o mesmo estado. Ele fechou uma das duas portas. **Provado por sonda
  temporária que eu escrevi, rodei e apaguei** — não por leitura.
  (2) **TEST-125-1** — a rota nova (`GET /clientes-contabilidade/faturamentos/lancados`) e o seu
  repositório estão com **zero teste**, enquanto o precedente que o próprio @dev cita como "espelho
  estrutural" ([D-2]) tem **dois arquivos** de teste. `requireRole`, o 400 de competência inválida e
  o dedup ficam sem trava.
  Nada disso é rework de comportamento entregue — são um caso de borda de recuperação e uma lacuna
  de cobertura em superfície nova. **A fila `RS-9` está liberada: 12.6 pode abrir.**

notes: >
  **Contaminação da árvore, declarada antes de qualquer número.** Diferente dos gates 12.1–12.4,
  esta revisão **não** roda sobre um commit: a 12.5 está **inteiramente não commitada**
  (`git status --short` com 19 arquivos de `apps/web` sujos + 1 rota nova não rastreada), e a árvore
  contém **também** a frente separada do lead (`server/gateway/mensagem-boleto.ts`,
  `server/gateway/email-gateway.ts`, `server/emissao/emitir-boleto.ts`,
  `reenviar_boleto/route.ts`, `tests/server/gateway/email-gateway.test.ts`). Conferi que os dois
  conjuntos **não têm um único arquivo em comum** e não há aresta de import entre eles; a frente do
  lead está fora do meu veredito, mas entra na aritmética da suíte — ver DOC-125-1, que é
  precisamente onde o Dev Agent Record escorrega.
  **Consequência operacional da árvore suja:** nas mutações eu **não** usei `git checkout --`
  (destruiria o trabalho não commitado do @dev). Copiei os 3 arquivos para um diretório temporário
  antes, restaurei a partir da cópia depois de cada mutação e fechei com `md5sum -c`: os 3 hashes
  batem com o estado pré-revisão. `git status` não tem nenhum arquivo meu sobrando.
  Comandos reexecutados por mim dentro de `apps/web`:
  · `npx tsc --noEmit` → **exit 0**, sem saída.
  · `npm run lint` (`next lint`) → "✔ No ESLint warnings or errors".
  · `npx vitest run` (suíte inteira) → **133 arquivos / 1229 testes, todos verdes**, exit 0,
    158,65s. Bate com o **Debug Log** (1229) e **não** com o Change Log da própria story (1228).
  · `npx vitest run` nos 4 arquivos tocados → **63/63 verdes**.
  · `npm run build` (`next build`, com `.next` limpo antes) → **exit 0**. Métrica verificável, no
    formato que eu mesma recomendei em OBS-123-6: **77 → 78 arquivos de rota** (exatamente a rota
    nova, nenhuma removida) e
    `/api/clientes-contabilidade/faturamentos/lancados/route` presente no
    `.next/server/app-paths-manifest.json`. Sem o `EINVAL readlink` de OneDrive desta vez, porque
    limpei o `.next` **antes** — que é o mesmo diagnóstico dos gates 12.4/12.3, agora com a
    profilaxia aplicada em vez de descoberta.
  · CodeRabbit CLI **não executado** — `wsl` não instalado nesta máquina, `skip_if_not_installed`.
    A revisão automatizada não aconteceu **em nenhuma das duas pontas** (nem @dev nem @qa); está
    registrado como limitação, não como item cumprido.

