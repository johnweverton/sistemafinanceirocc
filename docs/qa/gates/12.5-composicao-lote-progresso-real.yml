    email-gateway.test.ts`) — diferenciação do texto da mensagem de boleto entre cobrança médica e
    honorários contábeis por tipo de pagador. **Não avaliei contra os ACs da 12.5.**
  o_que_eu_confirmei: >
    · **Interseção de arquivos: zero.** Nenhum dos 5 arquivos da frente alheia aparece na File List
      da 12.5, e nenhum dos 15 arquivos da 12.5 aparece na frente alheia.
    · **Interseção de import: nenhuma aresta.** A 12.5 vive em `components/clientes-contabilidade`,
      `services`, `orchestrator`, `repositories/cliente-contabilidade-faturamento-repository` e 3
      rotas; a frente alheia vive em `server/gateway` + `server/emissao` + 1 rota de reenvio. O
      `execucao-orchestrator.ts` é o único arquivo grande tocado pela 12.5 e ele **não** importa
      `mensagem-boleto`/`email-gateway`.
    · **Nada quebrado:** suíte inteira verde (1229), `tsc` exit 0, build exit 0 — com as duas frentes
      na árvore ao mesmo tempo.
  unica_consequencia_para_a_12_5: >
    Os **+4 testes** de `email-gateway.test.ts` entram no total da suíte e foram atribuídos à 12.5 no
    Debug Log. Ver DOC-125-1. É a única contaminação, e é de contabilidade, não de comportamento.

impacto_no_sequenciamento: >
  **CONCERNS sem rework bloqueante. A fila `RS-9` avança: 12.6 está liberada para abrir.** Ordem
  obrigatória mantida — **12.3 → 12.4 → 12.5 → 12.6** (+ 12.8 na mesma contenção), com a fila
  estendida do arquivo (12.12 / 12.15 / 12.16 / 12.17) inalterada.
  **A 12.6 herda três itens, e é a última chance dos dois primeiros:** `DEB-12.5-A` (saída do estado
  `erro` — o único `medium` de código deste gate), `DEB-12.4-B` (terceiro ramo de rótulo) e
  `OBS-123-4a` (`comBoletoQ` fora da enumeração da AC 1). Os três são o **mesmo tema** — "esta tela
  não distingue erro de vazio de não-disparado" — e resolvem-se com uma passada só. **Os três exigem
  acréscimo explícito do @po à AC 1 e à File List da 12.6**; é o terceiro gate consecutivo em que
  peço isso e a AC 1 continua com a mesma enumeração de 4 pontos.
  Avisos para quem abrir a 12.6:
  · o arquivo cresceu **+253 linhas líquidas** (457 → **710**) e o deslocamento acumulado desde a
    redação do épico passa de **450** — tratar **toda** referência de linha como indicativa e
    localizar pelo trecho descrito (MNT-125-1);
  · o insumo já está pronto: `faturamentosLancadosQ` e `execucaoQ` são exatamente os dois pontos de
    carga novos que a 12.6 vai querer tratar, e os dois já têm `isError`/`isSuccess` expostos;
  · **`emVoo` mudou de semântica** (`calcular.isPending && !execucaoId`): quem mexer no fechamento do
    diálogo precisa saber que fechar durante o cálculo passou a ser **deliberadamente permitido**, e
    que há 3 testes travando isso nos dois sentidos.
  **Critérios de reprovação herdados, ainda vigentes e verificados como intactos neste gate:**
  (a) qualquer opt-in / checkbox de reinclusão / "emitir mesmo assim" que devolva ao payload um
  cliente já emitido viola o Cenário A da 12.3 — os testes de ausência (`:187-188`) continuam lá,
  **não removê-los**; (b) qualquer `brl`/`normalizarBusca`/`competenciaAtual` local reintroduzido, ou
  `<input type="text">` de competência novo, é regressão direta da 12.2; (c) tornar verde um teste da
  12.4 por mudança de asserção em vez de mudança de comportamento é reprovação — a 12.5 **reancorou**
  3 asserções (texto removido pela AC 1 → botão de calcular) e eu conferi uma a uma que a intenção
  foi preservada; quem repetir a manobra na 12.6 será conferido do mesmo jeito.
  **Critérios de reprovação novos, a partir deste gate:**
  (d) o AC 4 (só `ok` soma em "A emitir") e o `enabled: … && calculoConcluido` da `resultadosQ` são
  comportamento travado — as duas mutações correspondentes são discriminantes por verificação minha;
  (e) o `execucaoId` **não** pode voltar a ser criado depois do processamento (seria desfazer o AC 5);
  (f) `ProgressoExecucao` **não** pode ser mockado nos testes deste diálogo — é o mock que tornaria o
  AC 3 inverificável, e hoje só o cliente Supabase é dublê.
  Pendências que **não** bloqueiam a fila mas precisam de decisão do @po antes do fechamento do
  épico: `DEB-12.3-A` (sem dono; é o que impede declarar `RS-1` fechado), `DEB-12.3-C` (sem dono),
  `DEB-12.2-A` (sem dono), o dono de `DEB-12.5-B` (teste de servidor, fora da contenção) e os
  acréscimos explícitos de `DEB-12.5-A`/`DEB-12.4-B`/`OBS-123-4a` à **12.6**, `DEB-12.5-C` à
  **12.11**, `DEB-12.5-D` à **12.14** e `DEB-12.4-C`/`DEB-12.5-E` à **12.12**.
  Ação recomendada antes do deploy (não bloqueante para o gate): a passada manual de ~4 minutos de
  `limitacao_da_verificacao_manual.recomendacao`, em especial o item (i) — confirmar que a barra
  **anda**. É o único ponto em que a entrega desta story pode estar decorativa sem nenhum teste
  perceber.
