julgamento_d1_mudanca_de_contrato_da_rota:
  pergunta: >
    O @dev mudou o contrato de `POST /api/clientes-contabilidade/lote` (cria e responde; quem
    processa é `POST /api/execucoes/{id}/retomar`, chamado em seguida pelo diálogo), citando o
    achado de produção de 2026-08-05 sobre fire-and-forget na Vercel. A decisão procede? É segura?
  decisao: >
    **APROVADA, e o raciocínio se sustenta na fonte — não só na tabela do Dev Agent Record.** Fui
    verificar as três premissas que a tabela afirma, e as três se confirmam.
  status: "Decidida nesta revisão. Não volta pro @dev. Duas ressalvas registradas (REL-125-2, TEST-125-2)."
  fundamentacao: >
    **1. A opção (a) é mesmo inviável, e pelo motivo que ele dá.** Com a rota síncrona o
    `execucaoId` só nasce quando a promise resolve — não há sujeito para o AC 5 e não há o que a
    barra do AC 3 acompanhe durante os 300s. A story deixou isso em aberto ("Decisão de
    implementação do @dev"); ele fechou com a leitura correta.

    **2. A opção (b) é mesmo o achado de 2026-08-05, e (c) mesmo o evita.** Confirmei que em nenhum
    ponto do caminho novo existe promise solta: `retomar` faz `await dispararPrimeiroLote(...)`
    antes do `Response.json` (`retomar/route.ts`), e a rota de lote agora só faz
    `iniciarLoteClientesContabilidade` + `Response.json`. Sempre há um request segurando a function.

    **3. O pré-requisito escondido de `retomar` está satisfeito — e este era o ponto onde a decisão
    poderia morrer em silêncio.** `retomar` tem um guard `if (execucao.status !== 'processando')
    throw 422 EXECUCAO_NAO_RETOMAVEL`. Se `criarExecucao` gravasse `'pendente'`, **todo cálculo em
    lote falharia em produção com um 422**, e os testes de componente **não pegariam** (o `retomar`
    é dublê). Fui ao repositório: `execucao-repository.ts:83` grava literalmente
    `status: 'processando'`. Premissa confirmada.

    **4. Os papéis batem — e este era o segundo jeito de a decisão morrer em silêncio.** Se a rota
    de lote aceitasse um papel que `retomar` recusa, esse operador criaria a execução e levaria 403
    no passo seguinte, deixando uma execução travada em `processando` a cada tentativa. Conferi os
    dois `requireRole` na fonte: `lote/route.ts:38` = `['admin','colaborador']`;
    `retomar/route.ts` = `['admin','colaborador']`. **Idênticos.** (Note que a rota de leitura nova
    e a `com-boleto` usam `['admin','colaborador','financeiro']` — mais amplo, e correto: são
    leitura.) A afirmação "mesmos papéis" do Dev Agent Record é verdadeira.

    **5. `retomar` é reuso legítimo, não uma rota espremida para caber.** O cursor é
    `contarResultados`, derivado do banco — a idempotência não é convenção, é estrutural, e já era
    o destino do botão "Reprocessar". Os comentários das duas rotas e o JSDoc do serviço foram
    atualizados para descrever **os dois chamadores**, que é a mesma classe de correção
    comentário-vs-código do AC 6. Coerência de conduta, registrada como positiva.

    **6. A consequência declarada é honesta e o saldo é positivo.** "Cliente morre entre criar e
    processar ⇒ execução em `processando` com 0 resultados" é pior que zero, mas melhor que o
    estado anterior: antes a **mesma** falha acontecia (a function era suspensa no meio dos 300s) e
    era **invisível e sem identificador**. Agora aparece no diálogo, no histórico, e tem
    "Reprocessar" depois de 6 min. O @dev escreveu isso no comentário da rota em vez de escondê-lo.
  ressalvas_que_acompanham_a_aprovacao:
    - "REL-125-2 — o rate limit de `retomar` (5/min) passou a ser consumido pelo caminho NORMAL."
    - "TEST-125-2 (dentro de TEST-125-1) — mudança de contrato de rota sem teste de rota. Não havia antes tampouco; o consumidor é único (`grep dispararLote` confirma) e o fim a fim continua coberto pelo orquestrador. Aceito, registrado."
julgamento_d3_rotulo_do_progressoexecucao:
  pergunta: >
    O épico (§2, linha 170-172) lista `ProgressoExecucao` na coluna "Reaproveitado (sem mudar)". O
    @dev acrescentou uma prop opcional `rotulo`. É aceitável ou é um desvio a registrar?
  decisao: >
    **ACEITÁVEL — e é a escolha certa das três disponíveis.** Mas **é** um desvio, e eu registro,
    por um motivo que o @dev não viu: ele colide com a **AC 1 da 12.11**.
  fundamentacao: >
    **Por que aceito.** As alternativas eram (i) exibir "Processando médicos" num lote de clientes
    contábeis — mentira na tela, e a 12.11 existe justamente para caçar esse vocabulário; ou (ii)
    duplicar barra + `%` + detecção de travamento, que a seção **Testing** desta story **proíbe
    textualmente** ("não duplicar lógica de detecção de travamento"). Cumprir a letra da tabela do
    épico exigiria violar a letra da própria story. Entre uma tabela de planejamento e um critério
    de teste da story em execução, o segundo manda.
    A extensão é **estritamente aditiva**: parâmetro opcional com default igual à string anterior.
    Verifiquei os **dois** chamadores existentes na fonte — `NovaExecucao.tsx:1176` e
    `app/(dashboard)/execucoes/[id]/page.tsx:15` — e nenhum passa `rotulo`. Zero mudança de
    comportamento, como o Dev Agent Record afirma.
  o_que_registro_e_que_o_dev_nao_viu: >
    **A AC 1 da 12.11 diz, textualmente: "'Pagador' no lugar de 'médico' em `RelatorioGrupos.tsx:246,
    :439,:229` e `ProgressoExecucao.tsx:62`".** A linha `:62` era exatamente a string
    `Processando médicos`. Hoje `:62` não existe mais como alvo: a linha renderiza `{rotulo}` e o
    texto migrou para o **valor default do parâmetro** (`:19`). O @dev da 12.11 que procurar pela
    linha citada **não vai achar o que a AC descreve** — e, se não achar, o vocabulário fica.
    A boa notícia é que o desenho **facilita** a 12.11 em vez de atrapalhar: basta trocar o default
    por "Processando pagadores", e o `rotulo="Calculando clientes contábeis"` da 12.5 continua certo
    e não precisa de exceção. Só a instrução precisa ser reescrita.
  lacuna_de_protecao: >
    **Não existe `tests/components/ProgressoExecucao.test.tsx`** — conferido, o diretório não tem o
