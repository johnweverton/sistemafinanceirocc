      da 12.4 estabeleceu o hábito de conferir "delta de testes bate com o Change Log", e um delta
      contaminado por outra frente quebra a conferência da 12.6. Numa árvore que contém **duas
      frentes ao mesmo tempo**, "rodei a suíte e deu X" deixa de ser evidência atribuível.
    recommendation: >
      @dev: reconciliar o Change Log (1229) e a File List (+20) e marcar o delta como
