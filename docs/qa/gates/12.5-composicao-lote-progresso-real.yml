      Também vale registrar que o painel anuncia "no máximo 3 cálculos por minuto" e **não** o teto
      de retomadas — o que é defensável (é o limite que o operador controla), mas deixa de fora o
      único limite que pode falhar **no meio** do fluxo em vez de antes dele.
