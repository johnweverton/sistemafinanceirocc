limitacao_da_verificacao_manual:
  status: "NÃO EXECUTADA — nem pelo @dev, nem por mim. Registrado como limitação, não como item cumprido."
  o_que_o_dev_declarou: >
    "Sem verificação manual no browser (não há servidor de dev rodando nesta sessão)". Declaração
    honesta, mesmo padrão que elogiei em OBS-124-7 e que mantenho como positivo.
  o_que_eu_fiz_de_fato: >
    **Não subi o app no navegador.** Este ambiente de revisão não tem navegador. No lugar: li o
    caminho inteiro no código, rodei os testes de componente (jsdom/Testing Library), o `next build`,
    **5 mutações** para provar que os testes reagem e **1 sonda temporária** para provar um defeito
    que nenhum teste cobria (REL-125-1). Não vou carimbar como feito o que não foi feito.
  o_que_a_cobertura_de_componente_NAO_compensa:
    - >
      **A barra de progresso se mexendo de verdade.** jsdom renderiza `style={{ width: '42%' }}` e o
      teste confirma o número — mas o caminho completo (servidor grava a cada 5 pontos → Postgres
      Changes → `invalidateQueries` → refetch → nova largura) atravessa Realtime do Supabase, que
      está **mockado**. O `refetchInterval` de 3s é o fallback e também não é exercitado. Se o
      Realtime não estiver publicando a tabela `execucoes` para este canal, a barra ficaria parada em
      0% até o `retomar` responder — e **nenhum teste pegaria**. Risco avaliado como baixo por
      precedente (o mesmo componente já roda em produção no fluxo médico, com a mesma assinatura),
      não por verificação.
    - >
      **O caminho de rate limit real.** `assertRateLimit` é in-memory por instância; em serverless o
      comportamento efetivo depende de quantas instâncias atendem o usuário. Fora do escopo desta
      story (pré-existente), mas o painel agora **anuncia** o número — se o limite efetivo divergir
      do anunciado, a tela vira a fonte da mentira que [D-5] existe para evitar.
    - >
      **O empilhamento visual do `ProgressoExecucao` dentro do `<Modal>`** e o comportamento de foco
      quando o bloco de progresso substitui o bloco de composição no meio do fluxo (o elemento focado
      pode desaparecer sob o operador). Território da 12.1/12.12, não observado aqui.
  recomendacao: >
    Uma passada manual de ~4 minutos antes do deploy, cobrindo só o que jsdom não vê: (i) abrir o
    lote com ≥3 clientes, calcular, e confirmar **visualmente** que a barra sai de 0% e **anda**
    (é o objeto literal do título da story) — se ficar parada e pular para 100%, o Realtime/polling
    não está chegando e a entrega é decorativa; (ii) fechar o diálogo no meio do cálculo e reabrir,
    conferindo que volta a acompanhar a mesma execução; (iii) recarregar a página (F5) no meio do
    cálculo, mesma conferência. O item (i) é o único que eu classificaria como **recomendado antes do
    deploy**, e não apenas desejável.

