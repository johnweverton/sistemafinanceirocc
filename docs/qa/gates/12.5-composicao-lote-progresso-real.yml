rastreabilidade:
  AC1_composicao_e_limites:
    status: ATENDIDO
    codigo: >
      `LoteContabilidadeDialog.tsx:182-212` (`composicao` + `acimaDoTeto`) e `:564-620` (o painel).
      "Pronto pra calcular N clientes" **não existe mais** no arquivo — conferido por grep, e o
      teste tem a trava de ausência (`queryByText(/Pronto pra calcular/i)`).
      Os números fecham por construção: `faixa` e `fixo` derivam **ambos** de `elegiveis`
      (`:171-174` e `:192`), e `modoCobranca` é uma união de exatamente dois valores — logo
      `faixa + fixo === elegiveis.length`, que é o número do botão. Não há um terceiro balde
      silencioso.
      `cicloAdicionalVencendoNaCompetencia` é chamada com a **mesma assinatura e a mesma ordem de
      argumentos** de `GerarExecucao.tsx:31` (`competenciaBase, intervaloMeses, competencia`) —
      comparei as duas chamadas lado a lado. Sem cópia, sem variante, sem inversão silenciosa de
      parâmetro (que era o modo de falha barato aqui: três argumentos, dois deles strings).
      Limites em `@cobranca/shared` ([D-5]) lidos pelo schema (422), pela rota (rate limit), pelo
      orquestrador (alias) e pelo painel — fonte única de verdade, verificada nos 4 consumidores.
    discriminancia_reproduzida: >
      **Mutação E:** troquei `faturamentosLancadosQ.isSuccess ? (` por `true ? (`, que é exatamente
      o defeito que a story proíbe ("nunca chutar valor no resumo pré-cálculo"). Resultado:
      **2 failed | 39 passed**, e as duas falhas são literalmente
      "AC 1: enquanto a consulta de faturamento não responde o painel NÃO chuta '0 lançado'" e
      "AC 1: falha na consulta de faturamento vira 'não foi possível verificar', não um número
      inventado". O teste mede o **conteúdo renderizado**, não o valor da flag.
      **Mutação D (desenhada para pegar teste preguiçoso):** removi `|| acimaDoTeto` **só** do
      `disabled`, deixando o **rótulo** "Acima do teto de 200" intacto — um teste que verificasse
