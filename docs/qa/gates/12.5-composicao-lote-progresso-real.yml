      · `tests/server/gateway/email-gateway.test.ts` 10 → 14 = **+4** ← **frente do lead, não é 12.5**
      Ou seja: **+24 são da 12.5** e +4 são da correção separada de mensagem de boleto que o lead
      declarou. 24 + 4 = 28, a aritmética fecha — mas a atribuição não.
      **(c) A File List erra o próprio número.** Ela diz "+22 casos da 12.5" em
      `LoteContabilidadeDialog.test.tsx`; são **+20** (contei os `it` do bloco novo um a um: 8 de
