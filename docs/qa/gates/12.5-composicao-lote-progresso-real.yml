      cada 5 pontos, `Math.min(99, …)` (nunca 100 daqui) e `.catch(() => {})` para que falha de
      escrita de progresso não derrube o lote — as três propriedades **asseridas** nos 2 casos novos
      do orquestrador (monotonicidade, teto de 99, `gravados.length <= ceil(100/PASSO)` e
      `status === 'concluido'` mesmo com `atualizarProgresso` sempre lançando).
