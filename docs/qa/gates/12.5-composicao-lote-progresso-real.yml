      o cálculo é barrado aqui, não com um 422 depois do clique". O teste afirma `toBeDisabled()`
      **e** `expect(mockDispararLote).not.toHaveBeenCalled()` depois de um clique real. É a asserção
      certa.
  AC2_barra_de_selecao:
    status: ATENDIDO
    codigo: >
      Duas frentes, como as Completion Notes descrevem, e as duas confirmadas.
      (i) `ClientesContabilidadeManager.tsx:196-203` deriva `clientesSelecionadosInativos` e
      `:325-334` imprime "· N inativo(s) não entra(m) no cálculo em lote" **na mesma barra** onde a
      divergência aparece.
      (ii) a prop `inativosSelecionados` leva a mesma lista para a última linha do resumo.
    verificacao_extra_minha: >
      Fui atrás do buraco óbvio: um id selecionado que **não** esteja em `clientesPorId` cairia em
      nenhum dos dois baldes e a divergência voltaria sem explicação. **Não é alcançável**:
