    metade_2_escape_backdrop: >
      Os dois `it` que OBS-124-2 pediu existem (`Escape fecha`, `clique no backdrop fecha`, este
      último usando o `data-testid="modal-backdrop"` que eu apontei que o `Modal` já expunha), mais
