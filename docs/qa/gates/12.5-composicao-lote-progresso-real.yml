    titulo: "O rate limit de `retomar` (5/min) passou a ser consumido pelo caminho normal de cálculo, e a tela só anuncia o limite do lote (3/min)"
    description: >
      Achado desta revisão; o @dev registrou o fato nas "Divergências" e eu confirmo o número na
