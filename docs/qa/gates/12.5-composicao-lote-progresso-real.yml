# ─────────────────────────────────────────────────────────────────────────────
qualidade_dos_testes:
  veredito: "Discriminantes por prova — 5/5 mutações produziram exatamente as falhas esperadas, zero colateral"
  analise: >
    **+24 testes desta story** (20 de componente no diálogo, 2 no Manager, 2 no orquestrador) —
    ver DOC-125-1 para a reconciliação do número. Arquivo do diálogo: **41 casos**, dobrando os 21
    da 12.4. Suíte inteira reexecutada por mim: **133 arquivos / 1229 testes**, exit 0.
    · **Prova de discriminância, o item que sustenta o veredito.** Não confiei no @dev nem na minha
      leitura: mutei o `src` em 5 pontos independentes e rodei o arquivo a cada vez. Resultado:
      `valorAEmitir` sem o `filter(ok)` ⇒ **2 falhas**, os dois `it` do AC 4;
      remover `await execucoesService.retomar` ⇒ **2 falhas**, AC 3 e AC 5-reload;
      `gravarLoteEmAndamento` sem `setItem` ⇒ **1 falha**, AC 5-reload;
      remover `|| acimaDoTeto` do `disabled` ⇒ **1 falha**, AC 1 (G-13)-teto;
      `isSuccess ?` → `true ?` ⇒ **2 falhas**, os dois `it` de "não chuta número".
      Em **nenhuma** das 5 houve falha colateral nem falha a menos: o mapeamento AC↔teste é **exato**.
      Árvore restaurada a partir de cópia (não de `git checkout`, que destruiria trabalho não
      commitado) e conferida por `md5sum -c` no fim.
    · **Duas mutações foram desenhadas para pegar teste preguiçoso, e as duas pegaram.** No teto,
      removi só o `disabled` e deixei o rótulo "Acima do teto de 200" intacto — um teste de texto
      teria passado; o que existe assere `toBeDisabled()` e a **não-chamada** de `dispararLote` após
      um clique. No painel, forcei o ramo de sucesso com a query pendente — um teste que só olhasse
      "aparece o painel" teria passado; o que existe compara o **texto renderizado** e afirma o
      `not.toContain('com faturamento lançado ·')`.
    · **Asserções sobre o efeito de rede, não sobre estado interno.** O AC 3 assere
      `toHaveBeenCalledWith('exec-1')` no `retomar`; o AC 5 assere `mockDispararLote` chamado **1**
      vez após remontar (recuperou, não redisparou); o AC 1 assere `mockFaturamentosLancados`
      chamado **2** vezes após lançar faturamento (invalidação da query). É a camada certa em todos.
    · **`ProgressoExecucao` testado por reuso, não por mock.** O hook `useExecucaoRealtime` **não**
      foi mockado — só o cliente Supabase virou dublê. Isso é o que transforma "reaproveitei o
      componente" em fato verificável: o teste assere a frase "Isso pode levar alguns minutos…", que
      só existe no componente reaproveitado. Um `vi.mock` do `ProgressoExecucao` teria tornado o AC 3
      inverificável e é a saída que quase todo mundo toma.
    · **Trava de ausência preservada e ampliada.** Os `not.toBeInTheDocument()` do Cenário A da 12.3
      (`:187-188`, checkbox e "emitir mesmo assim") continuam **intactos** — verifiquei, é critério
      de reprovação herdado. A 12.5 acrescenta os seus: `queryByText(/Pronto pra calcular/i)` ausente
      (o texto que a AC 1 substitui não voltou), `/A emitir/` ausente durante o cálculo,
      `mockResultados` **não** chamado antes de concluir, "Emitir boletos em lote" ausente no lote
      100% alerta, e a barra sem explicação quando não há inativos.
    · **Regressão do arquivo vizinho tratada do jeito certo.** Os 4 casos quebrados em
      `LoteEmissaoDialog.test.tsx` (`vi.mock` do módulo inteiro sem `importOriginal`) foram
      corrigidos **atualizando o dublê**: contei os `it` antes e depois — **7 → 7**, nenhuma asserção
      removida, nenhuma afrouxada. As 3 asserções da 12.4 que dependiam do texto "Pronto pra
      calcular" foram **reancoradas no botão de calcular**, que é o mesmo sinal observável ("o passo
      avançou") por outro seletor — a intenção do teste da 12.4 está preservada. Este era o ponto
      onde a story poderia ter tornado testes verdes por mudança de asserção em vez de mudança de
      comportamento (**critério de reprovação declarado no gate da 12.4**); conferi um a um e **não
      é o caso**.
    · **Lacunas correspondentes aos achados:** a rota e o repositório novos, sem teste algum
      (TEST-125-1); o estado terminal `erro` sem teste de recuperação (REL-125-1 — existe um `it`
      que prova que o erro é **comunicado**, nenhum que prove que dá para **sair** dele); e o default
      do `rotulo` (ARCH-125-1).

nfr_validation:
  security:
    status: PASS
    notes: >
      **Rota nova auditada linha a linha contra o precedente.** `GET
      /api/clientes-contabilidade/faturamentos/lancados` faz `requireRole(['admin','colaborador',
      'financeiro'])` **antes** de qualquer leitura, valida `competencia` por regex Zod
      (`/^\d{4}-\d{2}$/`) e devolve 400 sem ela — exatamente os mesmos papéis, o mesmo schema e a
      mesma ordem de `com-boleto/route.ts`. Sem SQL cru (`.eq()` parametrizado do builder Supabase).
      O erro de banco vira `ApiError(500,…,'DB_ERROR')` com a mensagem em `details` — mesmo padrão do
      repositório vizinho.
      **A mudança de papel que eu fui procurar e não achei:** a rota de lote e a `retomar` exigem
      **exatamente** o mesmo par `['admin','colaborador']` — não há operador capaz de criar uma
      execução e incapaz de mandá-la processar. Era o modo de falha silencioso mais provável de
      [D-1] e ele não existe.
      **Superfície de leitura, avaliada e aceita:** a rota devolve os ids de **todos** os clientes com
      faturamento na competência, não só os da seleção do chamador — diferente da resolução de nomes
      da 12.4, que só resolvia ids que o próprio chamador enviou. Não é exposição real: os três
      papéis já listam a carteira inteira em `GET /clientes-contabilidade`, e o retorno é só um array
      de UUIDs, sem valor de faturamento, sem nome, sem documento. **O valor do faturamento nunca sai
      desta rota** — que é o dado sensível aqui. Idêntico ao que `com-boleto` já faz desde a 12.3.
      Nenhum `dangerouslySetInnerHTML`; tudo interpolado no JSX novo (`c.nome` dos adicionais,
      contagens, `brl()`) é escapado pelo React. `sessionStorage` guarda **só** `{ competencia,
      execucaoId }` — nenhum dado de negócio, nenhum valor, nenhum token — e o que é lido de lá é
      **validado por formato** antes de usado. `sessionStorage` e não `localStorage` é a escolha
      certa: o rastro morre com a aba.
  performance:
    status: PASS
    notes: >
      **Custo novo, contado:** (1) 1 GET a mais por montagem do diálogo e por troca de competência
      (`faturamentosLancados`, `staleTime: 0` deliberado, mesma razão do `comBoleto` da 12.3 — o
      passo 1 acabou de escrever nessa tabela), numa consulta de uma coluna só sem join; (2)
      **≤ 20 escritas de progresso por lote** no teto de 200 clientes ([D-4], `Math.floor(pct)` com
      passo de 5), contra 1 antes. Conferi que o teste **assere o teto** de escritas
      (`gravados.length <= ceil(100/PASSO)`), não só que existem escritas — é a asserção que impede
      alguém de "melhorar" o passo para 1 e multiplicar por 20 as escritas em `execucoes`.
      **Custo que eu fui verificar e que NÃO existe:** o `useQuery` extra do diálogo compartilha a
      `queryKey` do `useExecucaoRealtime`, então não há segundo fetch nem segundo canal Realtime — é
      um observer a mais do mesmo cache. E `resultadosQ` agora só dispara com a execução concluída
      (`enabled: !!execucaoId && calculoConcluido`), o que **elimina** os fetches parciais que o
      cálculo assíncrono teria produzido: líquido, provavelmente menos requisições que antes.
      Os derivados novos (`composicao`, `comFaturamentoLancado`) são `useMemo` O(n) sobre uma coleção
      limitada a 200 pelo schema. `next build` exit 0 com `.next` limpo; bundle de
      `/clientes-contabilidade` em **8,38 kB / 190 kB** de First Load, sem alerta de tamanho.
  reliability:
    status: CONCERNS
    notes: >
      **É aqui que a story ganha muito e perde um pouco, e é por isso que o gate é CONCERNS.**
      Ganhos concretos, todos travados por teste: (a) o `execucaoId` existe desde o primeiro instante
      e sobrevive a fechar/reabrir o diálogo — a execução órfã invisível dos 300s acabou; (b) o
      progresso é **real**, gravado no servidor durante o lote, e falha ao gravá-lo **não derruba o
      lote** (teste dedicado); (c) o `emVoo` deixou de bloquear o fechamento assim que o id existe —
      correto, porque a partir daí fechar não é destrutivo, e o lançamento de faturamento (escrita
      **sem** rastro consultável) continua bloqueando; (d) o resumo pós-cálculo deixou de somar
      alertas no valor "a emitir"; (e) o painel **nunca chuta** número — "verificando…" e "não foi
      possível verificar" são estados de primeira classe, com teste cada.
      Perda: **REL-125-1**. O estado terminal `erro` (e a falha persistente de `detalhe`) não tem
      saída — o rastro persiste, o botão de calcular não existe, a competência está travada e o ramo
      de erro do `ProgressoExecucao` não oferece "Reprocessar". A saída é abrir aba nova. É a mesma
      classe de defeito que o @dev corrigiu para 404; falta a porta gêmea. Sem perda de dado, com
      contorno óbvio para quem sabe que `sessionStorage` é por aba — e não óbvio para o operador.
      `tsc`, lint, **1229 testes**, build e 5 mutações: todos reexecutados por mim, todos verdes.
      **`RS-1` continua REDUZIDO, NÃO FECHADO** — esta story não mexeu nas camadas 1 e 3 do
      `DEB-12.3-A`, que seguem sem dono. Quem consolidar o Épico 12 não pode escrever "RS-1 fechado".
  maintainability:
    status: PASS
    notes: >
      **Reuso em vez de invenção nos quatro pontos onde havia tentação**, e nos quatro eu confirmei
      na fonte: `ProgressoExecucao` + `useExecucaoRealtime` (barra, `%`, `role="status"`, limiar de
      travamento e "Reprocessar" — nada reimplementado), `cicloAdicionalVencendoNaCompetencia` (a
      MESMA função de `GerarExecucao.tsx`, mesma ordem de argumentos, sem variante), `retomar` (rota
      existente, não rota nova) e o desenho de `com-boleto` como molde da rota nova. Zero componente
      novo, zero utilitário de formatação novo, **zero token e zero `.css`** — conferido por grep no
      `git status` (nenhum `.css`, nenhum `docs/design-system.md`, nenhuma migration), que é o
      critério de escopo D4 do épico.
      **Regressão da 12.2 (critério herdado): zero.** Grep nas linhas `+` do diff de `apps/web/src`
      por `function brl|function normalizarBusca|function competenciaAtual|toLocaleString('pt-BR')|
      toFixed|<input type="text"> de competência` → **nenhuma ocorrência**. Segue importando `brl` de
      `@/lib/formato` e usando `<CampoCompetencia>`.
      [D-5] é a melhoria estrutural silenciosa desta story e merece registro: o `200` estava escrito
      em dois lugares e o `3` num terceiro; agora os quatro consumidores (schema/422, rota/rate
      limit, orquestrador/`LOTE_MUITO_GRANDE`, painel/aviso) leem de `@cobranca/shared`, com o alias
      `LOTE_CLIENTES_CONTABILIDADE_MAX_ITENS` preservado para não quebrar quem já importava. Um
      limite que a tela "acha que sabe" seria pior que nenhum — e o AC 1 obrigava a tela a saber.
      Comentários novos explicam **por quê**: o de `:485-493` (o `DEB-12.4-A`), o do topo da rota de
      lote (a tabela de decisão de [D-1] resumida onde ela é lida), o do `catch {}` do storage e o de
      `:319-323` sobre o segundo observer da mesma query. As `[AUTO-DECISION]` estão todas com razão
      declarada, o que barateia a próxima revisão.
      Débito de manutenção real: a rota/repositório sem teste (TEST-125-1) e o crescimento do arquivo
      (MNT-125-1).

