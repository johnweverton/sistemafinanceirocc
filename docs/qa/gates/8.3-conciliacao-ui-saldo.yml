      (invisível para tsc/lint/vitest).
    recommendation: CORRIGIDA na iteração 1 (commit 1063865) — export removido, build validado.
  - id: OBS-832
    severity: low
    category: requirements
    description: >
      O card "totais do período" soma as transações FILTRADAS: com filtro de tipo/status
      ativo, "Recebido no período" pode mostrar R$ 0,00 (ex.: filtro "Débitos"). Coerente
      com a listagem exibida, mas o rótulo sugere o período inteiro.
    recommendation: >
      Validar com o dono se o card deve ignorar os filtros de tipo/status. Ajuste simples
      (calcular totais sem esses filtros) se desejado.
  - id: OBS-822
    severity: low
    category: code
    description: >
      Herdada do gate 8.2 e ainda válida: o fim do período é interpretado como fim do dia
      UTC — transações após ~21h de Brasília caem no dia seguinte do filtro.
    recommendation: Deferida — decidir fuso canônico de exibição/filtragem com o dono (pós-épico).
