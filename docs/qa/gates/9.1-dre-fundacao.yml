issues:
  - id: QA-911-1
    severity: medium
    category: code
    description: >
      `validarCamposPorTipo` em dre-repository.ts rejeitava `diaDoMes` fora de 1-28 por
      comparação direta (`< 1 || > 28`), mas NaN e valores fracionários (ex.: 15.5)
      passavam pela validação sem erro — `NaN < 1` e `NaN > 28` são sempre `false` em
      JS/TS, então a guarda "antes de bater no banco" (AC 4) não cobria esses casos. O
      CHECK da migration ainda protegia a integridade dos dados (NaN falha o `between 1
      and 28` do Postgres, fracionário falha a coerção para `integer`), mas o erro
      surgiria como 500 DB_ERROR em vez do 422 VALIDATION_ERROR limpo pretendido pela AC.
    recommendation: >
      CORRIGIDA na iteração 1 (commit local, ver Dev Agent Record) — adicionado
      `Number.isInteger(input.diaDoMes)` ao guard; teste dedicado cobrindo NaN e
      fracionário.
  - id: OBS-912
    severity: low
    category: performance
    description: >
      `extrato_transacoes.categoria_id` e `dre_lancamentos_manuais.categoria_id` não têm
      índice próprio — `excluirCategoria` faz 2 counts sem índice quando essas tabelas
      crescerem. Volume atual (centenas/mês, mesma premissa documentada no Épico 8) torna
      isso irrelevante hoje.
    recommendation: >
      Se o volume crescer, adicionar índice em migration aditiva futura (9.2/9.3 ou
      depois) — não bloqueia esta story nem as próximas do épico.
