issues:
  - id: REL-134-1
    severity: low
    status: CORRIGIDO (pós-gate, a pedido do dono)
    fix: >
      Chave de idempotência UUID gerada uma vez por execução (`executar-competencia.ts` →
      `chaveIdempotencia` no JSON). Servidor: coluna `iss_execucoes_agente.chave_idempotencia` + índice
      único parcial (0062); `registrarExecucaoIss` devolve a execução já gravada (antes da guarda da
      solicitação) e trata a corrida pelo 23505. JSON antigo sem chave continua aceito.
    titulo: "POST /api/integracoes/iss/execucoes não é idempotente — reenvio automático pode duplicar a execução"
    description: >
      `registrarExecucaoIss` sempre insere. Se o servidor gravou mas a resposta se perdeu (timeout de
      60 s do agente, queda de rede), `enviarComMarca` grava `envio-pendente` e a próxima execução
      reenvia a MESMA rodada → segunda `iss_execucoes_agente` + capturas duplicadas. Impacto funcional
      nulo na proposta vigente (mesmo `capturado_em` e valores), mas duplica trilha/histórico. Com o
      reenvio agora automático, o que antes dependia de alguém copiar um comando passa a acontecer sozinho.
    recommendation: "Chave de idempotência no servidor (competencia + iniciado_em + maquina): devolver a execução existente em vez de inserir."
  - id: REL-134-2
    severity: low
    status: CORRIGIDO (pós-gate, a pedido do dono)
    fix: >
      `ehRecusaDefinitiva` (4xx exceto 401/403/408/429): `enviarComMarca` grava `envio-recusado` em vez
      de `envio-pendente`; `reenviarPendentes` tira da fila (e JSON ilegível também). Testes em reenvio.test.ts.
    titulo: "Marca `envio-pendente` é permanente para erros determinísticos (422)"
    description: >
      Um 422 (ex.: cliente removido da carteira) nunca vai passar, mas a marca fica e o agente tenta
      de novo em toda execução, para sempre, logando a falha.
    recommendation: "Não marcar (ou marcar como `envio-recusado`, fora da varredura) quando o status for 4xx diferente de 401/408/429."
  - id: TEST-134-1
    severity: low
    titulo: "Lacunas pequenas de teste"
    description: >
      (a) `?lote=` inválido só é testado na função pura, não no Manager; (b) a ordem "reenvio antes dos
      alvos" e o pulo em --offline/--sem-envio vivem em `main()` (cli.ts), sem teste.
  - id: A11Y-134-1
    severity: info
    titulo: "Selo sem role=alert — aceitável"
    description: >
      Um `role="alert"` por linha disparava N anúncios ao abrir o diálogo; o progresso da busca já tem
      região `role="status"` (13.5) e o aviso de agente desligado continua `role="alert"`. O rótulo em
      texto ("Confira", "Digite à mão") não depende só de cor. `tabIndex=0` em `<p>` só para exibir o
      `title` é um paliativo: `title` não aparece em toque nem é lido de forma consistente — se o
      detalhe técnico precisar ser acessível, trocar por disclosure.
  - id: SEC-134-1
    severity: info
    titulo: "configurar mostra o CPF MASTER em claro no prompt \"Enter mantém …\""
    description: "Só local (tela do escritório); token já é mascarado. Considerar mascarar o CPF também."
  - id: OPS-134-1
    severity: info
    titulo: "Validação ao vivo pendente"
    description: "Duplo clique em TTY real (senha sem eco no console do Windows, `start` abrindo o navegador) e o link ?lote= em produção — pendência declarada pelo @dev."
