issues:
  - id: DATA-135-1
    severity: medium
    status: CORRIGIDO
    titulo: "Solicitação podia ser vinculada/concluída com execução de OUTRA competência"
    description: >
      `exigirSolicitacaoIssEmAndamento` (guarda do AC 13) só olhava status, e `concluirSolicitacaoIss`
      só dependia da FK. Uma execução de 2026-07 passava na guarda de uma solicitação de 2026-08 e a
      fechava como `concluida` — a tela diria "Busca no ISS concluída" sem nenhuma proposta nova da
      competência pedida.
    fix: >
      iss-solicitacao-repository.ts — `exigirSolicitacaoIssEmAndamento(id, competencia)` recusa com 422
      SOLICITACAO_INVALIDA; `concluirSolicitacaoIss` confere a execução (422 EXECUCAO_INVALIDA se não
      existe, 422 EXECUCAO_OUTRA_COMPETENCIA se o mês difere). iss-captura-repository.ts passa
      `input.competencia`. Testes: 2 no repositório, 2 nas rotas. Mutação (revertendo só o src): os 4
      falham, nada mais.
  - id: SEC-135-1
    severity: low
    status: CORRIGIDO
    titulo: "Mensagem de erro do modo vigiar sai da máquina sem redigir a senha"
    description: >
      Caminho novo: `concluir { erro }` grava a mensagem no banco e a mostra na tela. Só o CPF era
      redigido. Nenhuma mensagem conhecida hoje carrega a senha, mas G4 é regra dura.
    fix: "diagnostico.ts `redigirCredenciais` (CPF + senha ≥ 4) usada no log e no `redigir` do vigiar (cli.ts); 2 testes em cli-apoio.test.ts."
  - id: OPS-135-1
    severity: low
    status: CORRIGIDO (pós-gate, a pedido do dono)
    fix: >
      O instalador compila o agente UMA vez e a tarefa roda `node apps\agente-iss\dist\cli.mjs --uma-vez`
      por um roteiro gerado em %USERPROFILE%\agente-iss\tarefa-agendada.cmd (fora do OneDrive). Após
      `git pull`, rodar o instalador de novo.
    titulo: "Tarefa agendada recompila o agente a cada minuto dentro do OneDrive"
    description: >
      O `/tr` roda `npm run iss:faturamento -- --uma-vez`, e o script `start` é `node build.mjs && node
      dist/cli.mjs` — reescreve `apps/agente-iss/dist/cli.mjs` 1.440 vezes por dia numa pasta
      sincronizada pelo OneDrive (churn de sincronização, possível arquivo travado pelo sync).
    recommendation: "Na tarefa, chamar `node apps\\agente-iss\\dist\\cli.mjs --uma-vez` (build uma vez na instalação)."
  - id: OPS-135-2
    severity: low
    status: CORRIGIDO (pós-gate, a pedido do dono)
    fix: >
      O `/tr` passou a ser só o caminho do roteiro entre aspas (`\"%ROTEIRO%\"`); o `cd /d "%REPO%"` fica
      dentro do roteiro. Ensaio a seco com schtasks/npm trocados por echo, repositório e perfil com
      espaço no caminho: tarefa registrada com o caminho inteiro e roteiro executado com sucesso.
    titulo: "`/tr` quebra se o caminho do repositório tiver espaço"
    description: >
      `\"%REPO%\"` não é escape para o cmd: as aspas internas encerram o bloco e o caminho fica sem
      aspas. O caminho atual (…\\OneDrive\\Documentos\\JOHN\\Sistema_financeiro_cc) não tem espaço, então
      funciona hoje; em outra máquina/pasta com espaço a tarefa fica inválida.
  - id: CONC-135-1
    severity: low
    titulo: "Retomada por heartbeat pode duplicar trabalho se o agente original estiver vivo e lento"
    description: >
      Se uma única empresa travar > 10 min sem progresso, outro ciclo retoma; os dois terminam, o
      segundo `concluir` recebe 409 (logado). Duas execuções gravadas, mesma proposta. Premissa de um
      agente por vez (G4) torna isso teórico.
  - id: REL-135-1
    severity: low
    status: CORRIGIDO (pós-gate, a pedido do dono)
    fix: >
      O 422 da solicitação cancelada agora é recusa definitiva: vira `envio-recusado`, não entra na fila
      de reenvio, e a mensagem de falha deixa de prometer reenvio (vigiar.ts). A reentrega de uma
      execução JÁ gravada (solicitação concluída) é resolvida pela chave de idempotência (201 com a
      execução existente).
    titulo: "Cancelar entre o último progresso e o envio: proposta chega assim mesmo"
    description: >
      O POST /execucoes com `solicitacaoId` recebe 422, o JSON ganha `envio-pendente` e o reenvio
      automático o manda depois como execução comum. G3 preservada (é só proposta), mas contraria a
      expectativa de "cancelei". Mesmo mecanismo de REL-134-1/134-2 (gate 13.4).
  - id: UX-135-1
    severity: info
    titulo: "Aviso de 'parece desligado' pode acender cedo"
    description: >
      Entre a reivindicação e o progresso 0/N o agente roda `reenviarPendentes` + `buscarAlvos`; depois
      vem o login. Normalmente < 3 min, mas com várias pendências e rede lenta o aviso pode aparecer
      com o agente vivo. Enviar o progresso 0 antes do reenvio resolve.
  - id: MIG-135-1
    severity: info
    titulo: "0062 coerente com 0061; aplicação manual pendente"
    description: >
      SQL idempotente, CHECKs iguais aos da 0061, FKs para profiles e iss_execucoes_agente, índice
      único parcial + 2 de apoio, RLS só-leitura. A policy usa lista explícita de papéis (AC 4) em vez
      de `has_profile()` da 0061 — equivalente hoje (os 3 papéis são todos). Rollback comentado ok.
      Até ser aplicada, o painel mostra aviso e o passo 1 segue à mão (teste).
  - id: TEST-135-1
    severity: info
    titulo: "Sem teste contra Postgres real"
    description: "Índice parcial, FK e a semântica do UPDATE condicional são verificados só no dublê em memória."
