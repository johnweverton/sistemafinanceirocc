resumo_do_veredito: >
  CONCERNS (não bloqueante). Os 24 ACs estão implementados e o AC 25 (fora de escopo) respeitado.
  Achei um defeito médio — o vínculo solicitação ↔ execução não conferia a competência — e o
  corrigi com testes que reproduzem (4 testes novos; mutação: sem o fix, falham exatamente os 4).
  Segurança conferida na fonte: as 3 rotas do agente chamam `requireAgenteIssToken` (fail-closed,
  timingSafeEqual) e ficam fora do middleware de sessão pelo matcher `api/integracoes`; as rotas do
  operador passam pelo middleware (sessão) e por `requireRole(['admin','colaborador','financeiro'])`
  (mesma guarda de propostas-iss); o token do agente não abre rota de operador (teste). G1–G4
  preservadas: nenhuma rota recebe `ISS_SENHA`, nada grava em `clientes_contabilidade_faturamentos`,
  o agente continua só lendo o portal. O CONCERNS é pelo que só se valida em produção (0062 não
  aplicada, tarefa agendada não instalada) e por dois débitos operacionais da tarefa agendada.

notes: >
  Concorrência verificada: a reivindicação é SELECT + UPDATE condicional `.eq('status', lido)` (e
  `.eq('heartbeat_em', lido)` na retomada). Em READ COMMITTED o segundo UPDATE reavalia o WHERE após
  o lock da linha e afeta 0 linhas ⇒ 204 — dois agentes não levam a mesma solicitação. O índice único
  parcial `uq_iss_solicitacoes_competencia_ativa` impede duas ativas; o 23505 é tratado devolvendo a
  vencedora (201/200). Transições inválidas: progresso/concluir fora de `em_andamento` ⇒ 409;
  cancelar terminada ⇒ 422; cancelar no meio ⇒ próximo progresso 409 ⇒ agente para (parcial local,
  sem marca). Polling: `refetchInterval: (q) => ativa ? 5000 : false` + relógio de 15 s com
  clearInterval no cleanup; teste prova que o polling para ao concluir. Campos digitados nunca são
  sobrescritos (`faturamentos` só guarda o que o operador digitou; teste do tick com 777).

