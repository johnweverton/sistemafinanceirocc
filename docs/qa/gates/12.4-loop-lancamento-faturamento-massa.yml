issues:
  - id: OBS-124-1
    severity: low
    category: code
    status: debito-registrado
    titulo: "O comentário do bloco de falhas promete uma persistência que o `!execucaoId` nega — mesmo defeito que o AC 5 desta story existiu para corrigir"
    description: >
      Achado desta revisão. O comentário em `LoteContabilidadeDialog.tsx:305-308` diz:
      "*Sobrevive ao avanço pro passo de cálculo: quem falhou aqui vai virar alerta lá, e o operador
      precisa continuar enxergando quem foi.*" Mas a condição de render, 1 linha abaixo, é
      `{!execucaoId && ultimoLancamento && …}` — o bloco **desaparece exatamente quando** as falhas
      viram alerta, que é o momento que o comentário diz estar cobrindo.
      A ambiguidade está em "passo de cálculo": se for lido como o estado "Pronto pra calcular", o
      comentário é verdadeiro; se for lido como o painel de resultados, é falso. A segunda oração
      ("vai virar alerta lá") só faz sentido na segunda leitura, então o comentário se contradiz
      sozinho. O mesmo escorregão está no comentário do teste (`:299`, "Persistente: sobrevive ao
      avanço para o passo de cálculo") enquanto a asserção ao lado verifica a presença de
      "Pronto pra calcular" — ou seja, o teste mede a 1ª leitura e o comentário descreve a 2ª.
      **O comportamento está certo** — é decisão documentada ([AUTO-DECISION] do @dev) e eu a aprovei
      (D-4), inclusive porque a informação sobrevive em outra forma (alertas do resultado, `:405-415`).
      O problema é só o registro. Levanto como `low` e não como nota de rodapé por uma razão
      específica: **é literalmente a mesma classe de defeito que motivou o AC 5 desta story** — um
      comentário local afirmando uma garantia que o código não dá (OBS-123-2 da 12.3). Esta story
      corrigiu um comentário mentiroso e introduziu outro, menor. O padrão merece ser interrompido.
    recommendation: >
      Uma frase. Trocar por algo como: "Persiste enquanto o passo 1 está na tela (some ao entrar no
      resumo do lote — lá as falhas reaparecem como `alerta` do resultado, `:405-415`)". Roteado em
      `DEB-12.4-A` para a **12.5**, que já vai reescrever essa região do componente. **Não** abrir
      commit só para isto — o arquivo está na fila `RS-9` e um commit de comentário custaria uma
      rodada de contenção inteira por uma linha.
  - id: OBS-124-2
    severity: low
    category: tests
    status: debito-registrado
    titulo: "\"Cancelar/Escape/backdrop caem no lado seguro\": 3 saídas afirmadas, 1 travada por teste"
    description: >
      Achado desta revisão. As Completion Notes afirmam (AC 4) que "Cancelar/Escape/backdrop caem no
      lado seguro (campos em branco)". Verifiquei a afirmação por composição e ela é **verdadeira**:
      `ConfirmDialog` passa `onClose={onCancel}` ao `Modal` e `emVoo={confirmando}` é `false` aqui,
      então `Modal.tentarFechar` (`:108-114`) chama `onCancel` direto tanto no Escape (`:147-150`)
      quanto no `mousedown` do backdrop (`:184-187`); `onCancel` é `() => setTrocaCompetencia(null)`
      e os valores já foram zerados antes do diálogo montar. As três saídas convergem, de fato.
      **Mas só o "Cancelar" tem asserção.** Escape e backdrop dependem de o `Modal` continuar se
      comportando assim — e o `Modal` está na fila de mais 5 stories (12.12, 12.15, 12.16, 12.17 e a
      própria 12.16 do `DEB-12.1-A`, que quer travar o scroll do `<body>`). Numa story cujo risco
      declarado é `RS-3` e cujo desenho inteiro se apoia em "toda saída ambígua é segura", deixar
      2/3 das saídas sem trava é a lacuna que eu apontaria mesmo num commit impecável.
      Não rebaixa o gate: o comportamento **é** correto hoje, e a asserção que falta protege contra
      regressão futura, não contra defeito presente.
    recommendation: >
      Dois `it` curtos no `LoteContabilidadeDialog.test.tsx`, reusando o setup de `preencher()` que
      já existe: (a) `fireEvent.keyDown(document, { key: 'Escape' })` com a confirmação aberta →
      confirmação some **e** `getAllByRole('spinbutton')[0]` segue `toHaveValue(null)`;
      (b) `fireEvent.mouseDown` no `data-testid="modal-backdrop"` do topo → idem. O `Modal` já expõe
      o `data-testid` necessário. Roteado em `DEB-12.4-A`.
  - id: OBS-124-3
    severity: low
    category: code
    status: debito-registrado
    titulo: "Competência vazia deixa os DOIS botões desabilitados sob o rótulo falso \"Verificando emissões…\", sem bloco de erro"
    description: >
      Achado desta revisão, rastreado no código. `CampoCompetencia` é um `<input type="month">` e o
      seletor nativo **permite limpar o campo** (`e.target.value === ''`, documentado no próprio
      JSDoc do componente: "AAAA-MM ou '' quando o operador limpa"). Com `competencia === ''`:
      · `comBoletoQ` tem `enabled: false` (a regex `/^\d{4}-\d{2}$/` não casa) → o status fica
        `pending`, nunca `success` nem `error`;
      · logo `guardaPronta === false`, mas `comBoletoQ.isError === false`;
      · resultado: "Calcular" **e** "Lançar faturamentos e continuar" ficam desabilitados exibindo
        **"Verificando emissões…"**, e o `<p className="alert-error">` de falha da guarda (`:289-294`)
        **não** aparece, porque não houve erro. A tela afirma estar verificando algo que nem foi
        disparado.
      Enquadramento justo, em duas direções:
      · **Não é regressão — é melhora com verruga.** Antes desta story o botão de lançar estava
        *habilitado* nesse estado e o clique produzia um 422 do `competenciaSchema`. Trocar um erro
        por um disabled é estritamente melhor; só o rótulo ficou errado.
      · **Não é achado novo, é a mesma raiz do OBS-123-4a**, que eu já levantei no gate da 12.3
        ("rótulo que mente depois da falha, sem ramo para `isError`") e roteei para a 12.6. O AC 5
        desta story fez o botão de lançar **herdar** o `guardaPronta` — e, junto, herdar o defeito de
        rotulagem. Herança correta do gate: o pedido do `DEB-12.3-B` era exatamente `|| !guardaPronta`,
        e o @dev entregou isso. Não é desvio.
      · A recuperação é trivial e óbvia (escolher um mês de novo, no campo logo acima), então o
        impacto operacional é quase nulo.
    recommendation: >
      **→ 12.6**, somado ao OBS-123-4a que já está roteado para lá. Quando a 12.6 for tratar
      "erro vs. vazio" neste arquivo, o ternário de rótulo precisa de **três** ramos, não dois:
      pendente real (`isFetching`), erro (`isError` → "Não foi possível verificar" + ação de retry)
      e **não-disparado** (`!enabled` → "Escolha a competência"). Registrado em `DEB-12.4-B`.
      **Atenção ao roteamento (padrão recorrente deste épico):** a AC 1 da 12.6 enumera 4 pontos de
      carga e o `comBoletoQ` **continua fora dela** — é o mesmo aviso que deixei no gate da 12.3 e
      que ainda não foi endereçado. Enumeração fechada não absorve item novo por herança. Se o @po
      não acrescentar explicitamente o ponto da guarda à AC 1 **e** à File List da 12.6, tanto
      OBS-123-4a quanto este item morrem no Dev Agent Record.
  - id: OBS-124-4
    severity: info
    category: code
    status: verificado-sem-acao
    titulo: "O pior caso do `.in()` de resolução de nomes (200 ids) é exatamente o caso em que o nome mais importa — e o best-effort já absorve"
    description: >
      Achado desta revisão, registrado porque é o tipo de coisa que só aparece no dia ruim.
      `lancarFaturamentoLoteSchema` permite `.max(200)` lançamentos. Se **todos** falharem,
      `resolverNomesDasFalhas` monta um `.in('id', ids)` com 200 UUIDs, que o PostgREST serializa na
      **query string** (~7,8 kB só de ids). Isso flerta com o limite de header/URL de proxies
      (`large_client_header_buffers` costuma ser 8 kB), e um 414/400 nessa chamada é plausível.
      A ironia estrutural vale registro: o caso de maior risco de estourar a URL é o mesmo caso em
      que a lista de nomes é mais útil ao operador (200 clientes falhados).
      **Por que fica como `info` e sem ação:** o desenho *já* trata isso corretamente. O `try/catch`
      converte o erro em `'—'` e os lançamentos continuam contados — que é precisamente o cenário do
      teste "busca de nomes falhando não derruba o lote". A degradação é para "UUID→'—'", não para
      perda de dado. Além disso, "200 lançamentos, 100% falhando" implica indisponibilidade do banco,
      e nesse estado a lista de nomes é o menor dos problemas. A carteira real (~120 boletos/mês,
      número da migration 0037) está uma ordem de grandeza abaixo.
    recommendation: >
      Nenhuma ação nesta story. Se algum dia a carteira crescer a ponto de lotes de 200 virarem
      rotina — que é, aliás, o **mesmo gatilho de 50 clientes** que a D7 do épico define para a
      12.15 — o conserto é fatiar o `.in()` em blocos de ~50. Registrar junto ao gatilho da D7 em vez
      de criar item solto.
  - id: OBS-124-5
    severity: info
    category: code
    status: verificado-sem-acao
    titulo: "Depois de um lançamento bem-sucedido os valores continuam em `faturamentos` — trocar o mês oferece carregar valores JÁ LANÇADOS descritos como \"digitados\""
    description: >
      Achado desta revisão. `lancarFaturamentos.onSuccess` não limpa `faturamentos` (de propósito: o
      AC 3 depende disso para que "Tentar de novo" não obrigue a redigitar). Consequência: depois de
      lançar 2026-06 com sucesso, trocar para 2026-07 encontra `digitados.length > 0` e abre o
      `ConfirmDialog` oferecendo "manter" valores que **já foram lançados no mês anterior**, com a
      mensagem "Você tinha N valor(es) de faturamento digitado(s)…" — tecnicamente verdadeiro
      (foram digitados) mas incompleto (também foram gravados).
      **Por que não é defeito.** (a) Chegar ao estado perigoso exige **dois** atos afirmativos
      distintos: confirmar "Manter os N valores em 2026-07" e depois clicar em lançar. (b) A lista
      itemizada mostra os valores. (c) Reaproveitar o faturamento do mês anterior como ponto de
      partida é, para clientes `faixa_faturamento`, um fluxo **legítimo** e provavelmente desejado —
      não uma armadilha. (d) `clientes_contabilidade_faturamentos` tem
      `unique (cliente_contabilidade_id, competencia)` (migration 0031), então não há duplicação:
