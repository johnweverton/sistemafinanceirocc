  - id: DEB-12.3-A
    severity: medium
    category: architecture
    status: "AINDA SEM DONO — reafirmado neste gate"
    titulo: "Guarda de servidor por `(cliente_contabilidade_id, competência)` — o resíduo de `RS-1`"
    atualizacao_desta_revisao: >
      A 12.4 fechou a **camada 2** das três descritas no gate da 12.3 (janela de cache de cliente,
      via `staleTime: 0`). Continuam abertas: **camada 1** (corrida entre abas/operadores) e
      **camada 3** (calcular → calcular → emitir os dois). Nenhuma story aberta é dona.
      **`RS-1` segue REDUZIDO, NÃO FECHADO.** Se alguém escrever "RS-1 fechado" ao consolidar o
