impacto_no_sequenciamento: >
  **PASS sem rework. A fila `RS-9` avança: 12.5 está liberada para abrir.** Ordem obrigatória
  mantida — **12.3 → 12.4 → 12.5 → 12.6** (+ 12.8 na mesma contenção), com a fila estendida do
  arquivo (12.12 / 12.15 / 12.16 / 12.17) inalterada.
  Avisos para quem abrir a 12.5:
  · o arquivo cresceu **+131 linhas líquidas** (326 → 457) e o deslocamento acumulado desde a
    redação do épico já passa de 200 — tratar toda referência de linha como indicativa (OBS-124-6);
  · o bloco "Pronto pra calcular" (`:376-383`) está intacto e é exatamente o que a AC 1 da 12.5 vai
    substituir; `ultimoLancamento` e `pendentesRetry` já fornecem o "Y lançado · Z pendente" que essa
    AC pede — **não recalcular esse dado do zero**;
  · `DEB-12.4-A` cabe naturalmente no diff da 12.5 (uma frase de comentário + dois `it`), **se o @po
    acrescentar explicitamente**. Enumeração de AC fechada não absorve item novo por herança — este
    épico já perdeu itens assim em 12.1, 12.2 e 12.3, e o padrão se repetiu na 12.3→12.6.
  · **Critérios de reprovação herdados, ainda vigentes:** (a) qualquer opt-in / checkbox de
    reinclusão / "emitir mesmo assim" que devolva ao payload um cliente já emitido viola o Cenário A
    da 12.3 — os testes de ausência (`:123-124`) existem para pegar isso, **não removê-los**;
    (b) qualquer `brl`/`normalizarBusca`/`competenciaAtual` local reintroduzido, ou qualquer
    `<input type="text">` de competência novo, é regressão direta da 12.2.
  · **Critério de reprovação novo, a partir deste gate:** o AC 1 da 12.4 (o passo 1 só avança com
    `lancados > 0`) e o `|| !guardaPronta` do botão de lançar são agora comportamento travado. Os
    testes "AC 1: 100% de falha NÃO avança" e os dois de "AC 5" são discriminantes por verificação
    minha — qualquer story da fila que os torne verdes por mudança de asserção em vez de mudança de
    comportamento é reprovação.
  Pendências que **não** bloqueiam a fila mas precisam de decisão do @po antes do fechamento do
  épico: `DEB-12.3-A` (sem dono; é o que impede declarar `RS-1` fechado), `DEB-12.3-C` (sem dono),
  `DEB-12.2-A` (sem dono) e os acréscimos explícitos de `DEB-12.4-B` à 12.6 e `DEB-12.4-C` à 12.12.
  Ação recomendada antes do deploy (não bloqueante para o gate): a passada manual de ~3 minutos
  descrita em `limitacao_da_verificacao_manual.recomendacao` — nem o @dev nem eu subimos o navegador.
