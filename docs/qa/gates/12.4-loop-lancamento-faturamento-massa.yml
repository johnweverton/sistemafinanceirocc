      Registro para que ninguém "conserte" isto limpando `faturamentos` no `onSuccess` — isso
      quebraria o AC 3.
    recommendation: >
      Nenhuma ação. Se o @po quiser precisão de linguagem, o lugar é a 12.5 (que já vai distinguir
      "lançado" de "pendente" no resumo de composição): a mensagem poderia diferenciar valores
      pendentes de valores já lançados. Melhoria cosmética, não correção.
  - id: OBS-124-6
