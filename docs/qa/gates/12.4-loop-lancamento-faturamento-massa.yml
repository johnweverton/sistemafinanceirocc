debitos_tecnicos_do_epico:
  - id: DEB-12.4-A
    severity: low
    category: code+tests
    titulo: "Comentário do bloco de falhas + asserções de Escape/backdrop do `ConfirmDialog`"
    origem: "OBS-124-1 e OBS-124-2 desta revisão"
    dono_proposto: "**12.5** — próxima da fila `RS-9`, abre `LoteContabilidadeDialog.tsx` **e** `LoteContabilidadeDialog.test.tsx`"
    verificacao_do_roteamento: >
      Conferido na fonte, não por suposição (regra herdada dos gates da 12.2 e 12.3): a File List
      proposta da 12.5 inclui `LoteContabilidadeDialog.tsx` e o teste correspondente, e a AC 1 da
      12.5 substitui justamente o bloco "Pronto pra calcular", vizinho imediato do comentário a
      corrigir. O roteamento é válido em termos de arquivo.
    recomendacao: >
      @po: acrescentar **explicitamente** às Dev Notes da 12.5 (não apenas confiar em herança):
      (a) reescrever o comentário de `:305-308` para dizer o que o `!execucaoId` realmente faz;
      (b) dois `it` travando Escape e backdrop da confirmação de troca de competência no lado seguro.
      **Motivo de exigir acréscimo explícito:** as ACs 1–5 da 12.5 são enumeradas e fechadas sobre
      composição e progresso; nenhuma menciona o bloco de falhas nem o `ConfirmDialog`. Este épico já
      perdeu itens exatamente assim três vezes (12.1, 12.2, 12.3). "A story já abre o arquivo" não
      basta.
      **Não abrir commit avulso para isto** — o arquivo está em contenção `RS-9`.
  - id: DEB-12.4-B
    severity: low
    category: code
    titulo: "Terceiro ramo de rótulo: competência não informada ≠ verificação pendente ≠ erro"
    origem: "OBS-124-3 desta revisão"
    dono_proposto: "**12.6** — dona declarada de \"erro vs. vazio nos pontos de carga\" neste arquivo; agrupa com OBS-123-4a"
    avaliacao: >
      Este item e o OBS-123-4a (roteado pelo gate da 12.3) são o **mesmo defeito de rotulagem** visto
      de dois ângulos: o ternário do rótulo distingue apenas `isPending` de `guardaPronta`, sem ramo
      para `isError` (12.3) nem para `!enabled` (12.4). A 12.4 propagou o `guardaPronta` para o
      segundo botão, como o `DEB-12.3-B` mandava — e com ele propagou o defeito. Corrigir os dois
      juntos é uma função de rótulo com 3 ramos usada nos 2 botões.
    recomendacao: >
      @po: **acrescentar o `comBoletoQ` à AC 1 e à File List da 12.6.** Este é o segundo gate
      consecutivo em que registro isto e ele continua pendente: a AC 1 da 12.6 enumera 4 pontos de
      carga e cita `LoteContabilidadeDialog.tsx:73-79` (a query de `resultados`, hoje deslocada — ver
      OBS-124-6). O `comBoletoQ` **não está na enumeração**. Sem acréscimo explícito, tanto
      OBS-123-4a quanto OBS-124-3 morrem no Dev Agent Record da 12.6.
  - id: DEB-12.4-C
    severity: info
    category: requirements
    titulo: "O bloco de falhas por nome é o novo candidato nº1 a anúncio assistivo — e não está em nenhuma AC da 12.12"
    origem: "Consequência do AC 2 desta story + [AUTO-DECISION] do @dev que difere a11y para a 12.12"
    avaliacao: >
      O @dev acertou em **não** adicionar `role="status"`/`role="alert"` aqui (é escopo declarado da
      12.12, e o gate da 12.3 roteou o `role="alert"` deste arquivo para lá). Mas a 12.4 criou um
      alvo que não existia quando a 12.12 foi escrita: um bloco que **aparece dinamicamente** com a
      lista de quem falhou, sem nenhum anúncio — para leitor de tela, o clique em "Lançar" hoje
      produz só o toast, e o conteúdo mais importante (quem falhou e por quê) surge em silêncio.
      Note o contraste que confirma o ponto: o padrão que a AC 2 mandou copiar
      (`ClientesContabilidadeManager.tsx:263`) usa `<p role="alert" className="alert-error">`. A
      cópia trouxe o visual e deixou a semântica para trás — corretamente, por escopo, mas alguém
      precisa reencontrá-la.
      As ACs da 12.12 são todas enumeradas: a AC 5 lista 6 pontos de carregamento e a AC 6 fala dos
      *inputs* de faturamento (`:130-140`). **O bloco de falhas não está em nenhuma das duas.**
    recomendacao: >
      @po: acrescentar explicitamente à AC 5 (ou como AC nova) da **12.12** o bloco de falhas do
      lançamento em massa (`LoteContabilidadeDialog.tsx:309-331` em `382a366`, localizar pelo trecho
