julgamento_ac4_limpa_e_pergunta:
  pergunta: >
    A AC 4 dizia "limpa os valores **OU** pede confirmação explícita". O @dev fez as duas coisas:
    sempre limpa (estado seguro por padrão) e oferece um `ConfirmDialog` para reaproveitar os
    valores na competência nova, listando `nome: R$ valor`. Cumpre a intenção da AC? É aceitável
    ter ido além da letra (que sugeria "ou" exclusivo)?
  decisao: >
    APROVADO — e o "ou" da AC não era exclusivo. O desenho entregue **domina estritamente** as duas
    alternativas isoladas e é o único que fecha o `RS-3` sem custo operacional.
  status: "Decidido nesta revisão. Não é desvio, não volta pro @dev, não reabre a 12.4."
  fundamentacao: >
    **1. A própria AC descreve este desenho, não os dois alternativos.** O parêntese da AC 4 é
    literalmente `("manter os 12 valores digitados para 2026-08?")`. Uma pergunta cuja resposta
    afirmativa é *manter* só faz sentido se o padrão for *não manter* — ou seja, a AC já pressupõe
    limpeza como estado base e confirmação como via de exceção. Ler o "ou" como exclusivo obrigaria
    a descartar o exemplo que a própria AC dá. O @dev implementou o exemplo.

    **2. Cada alternativa isolada é pior, e por motivos diferentes.**
    · *Só limpar:* seguro, mas destrói trabalho sem recurso. Quem digitou 12 valores e percebeu que
      errou o mês tem que redigitar 12 valores — e o comportamento previsível de um operador
      castigado por trocar de mês é **não trocar de mês**, ou trocar e redigitar às pressas. A
      mitigação de `RS-3` viraria um incentivo a `RS-3`.
    · *Só perguntar:* a pergunta "manter ou descartar?" tem que ter um comportamento para
      Escape/backdrop/desistência, e o comportamento natural de "confirmar para descartar" é
      **manter** — isto é, o caminho passivo cai no lado perigoso. É a mesma inversão de modo de
      falha que este épico já rejeitou uma vez.

    **3. A direção da falha está certa, e é o mesmo princípio que já aprovei na 12.3.** O gate da
    12.3 aceitou D-1 (guarda que falha **fechada**) com o argumento de que a saída ambígua deve cair
    no lado seguro. Aqui vale idêntico: `onCancel`, Escape e backdrop **todos** convergem em
    `setTrocaCompetencia(null)` — e os valores já foram zerados antes do diálogo aparecer, então
    nenhum desses caminhos precisa "lembrar de limpar". O estado perigoso (12 valores do mês
    anterior no mês novo) exige um clique afirmativo num botão cujo rótulo **nomeia a competência
    de destino**: `Manter os 1 valores em 2026-07`. Não dá pra cair nele por inércia.

    **4. O consentimento é informado, não cego.** O `ConfirmDialog` recebe `itens` com
    `nome: R$ valor` de cada lançamento (`:430-434`), usando `brl()` do `@/lib/formato` da 12.2.
    Isso responde à objeção que eu levantaria contra qualquer "manter os valores": operador que
    confirma sem saber *o que* está mantendo. Aqui ele vê a lista.

    **5. O custo de "ir além" é ~20 linhas e zero superfície nova.** Reusa `ConfirmDialog`
    (componente já existente, `tone="neutral"` — o tom certo: não é ação destrutiva irreversível, e
    o `tone` evita o aviso "NÃO PODE ser desfeita" que seria falso aqui). Nenhum componente novo,
    nenhum token, nada de `docs/design-system.md`. Não invade escopo de 12.5, 12.12 nem 12.15.

    **6. Prova de que não é fachada.** O teste "AC 4: confirmar 'manter' reaproveita os valores na
    competência nova" não se contenta em ver o campo preenchido: ele clica em lançar e afirma
    `toHaveBeenCalledWith('2026-07', [{ clienteContabilidadeId: 'cc-1', faturamento: 4500 }])` —
    a competência do **payload**, que é onde `RS-3` se materializa. É a asserção certa.
  ressalvas_que_acompanham_a_aprovacao:
    - >
      **Não confundir com o rascunho proibido pela 12.15.** As Dev Notes da 12.15 vetam rascunho em
      `localStorage` justamente por "valor de um mês reaparecendo em outro (`RS-3`)". O que a 12.4
      entrega é o oposto disso em três eixos: é **em sessão** (nada persistido), **por ocorrência**
      (uma confirmação por troca, não uma regra permanente) e **itemizado** (o operador vê os
      valores). Registro para que ninguém cite a 12.4 como precedente para reabrir o rascunho — e
      para que ninguém confunda o `ConfirmDialog` com a funcionalidade vetada e tente removê-lo.
    - >
      Confirmado o "manter", **nada na tela marca que aqueles valores vieram de outro mês**. A
      mitigação existente é indireta mas real: a competência nova está no campo logo acima e o texto
      de apoio do passo diz "lance o faturamento de **2026-07** pra cada um". Aceito como
      suficiente; se o @po quiser reforço, o lugar natural é o painel de composição da **12.5**
      (AC 1), não uma correção aqui.
    - >
      Só o **Cancelar** está travado por teste; Escape e backdrop não. São seguros por construção
      (ver OBS-124-2) mas não por asserção.
julgamento_ac5_deb_12_3_b:
  pergunta: >
    Confirmar que `comBoletoQ` usa `staleTime: 0` (não o global de 30s), que o comentário incorreto
    foi corrigido, que o botão de lançar respeita `!guardaPronta`, e **reproduzir por conta própria**
    a afirmação do @dev de que o teste do AC 5 é discriminante.
  decisao: "CONFIRMADO nas três partes, com a discriminância reproduzida por mutação — não por leitura."
  status: "`DEB-12.3-B` FECHADO. Pode ser marcado como resolvido no registro do épico."
  verificacao_1_staletime:
    codigo: "`LoteContabilidadeDialog.tsx:64-69` — `staleTime: 0` dentro do `useQuery` de `comBoleto`, e SÓ ali."
    global_intocado: >
      `app/providers.tsx` **não** aparece no `--name-only` do commit. O default global segue
      `staleTime: 30_000` + `refetchOnWindowFocus: false` para o app inteiro, como devia — o débito
      pedia sobrescrita local, não mudança global (que teria efeito colateral em 100% das telas).
    comentario_corrigido: >
      O comentário mentiroso da 12.3 ("Sem `staleTime` de propósito") foi **substituído**, não
      apagado: `:60-63` agora diz que o padrão do app é 30s, que o `force-dynamic` só desliga o cache
      HTTP e não o do react-query, e qual era a janela concreta ("reabrir o diálogo logo depois de
      uma emissão servia a lista antiga por até 30s"). É a correção que OBS-123-2 pediu, com a
      distinção HTTP-vs-cliente explicitada em vez de subentendida.
    discriminancia_reproduzida: >
      **Feito por mim, não aceito por relato.** Removi a linha `staleTime: 0` do componente e rodei
      `npx vitest run tests/components/LoteContabilidadeDialog.test.tsx`:
      resultado **`1 failed | 20 passed (21)`**, e a falha é exatamente
      "AC 5 (DEB-12.3-B): a guarda ignora o staleTime global — reabrir o diálogo revalida", com
      `AssertionError: expected "spy" to be called 2 times, but got 1 times`. Com a linha de volta,
      21/21. Arquivo restaurado com `git checkout --` e `git status -- apps/web` vazio depois.
      **Não é falso-positivo**, e o mecanismo do teste é o correto: ele injeta um `QueryClient` com
      `staleTime: 30_000` (cópia declarada do `app/providers.tsx`) **compartilhado entre as duas
      montagens** e conta as chamadas de `comBoleto`. Sem a sobrescrita local, a 2ª montagem serve
      o cache fresco e não refaz a chamada; com ela, refaz. O teste mede o comportamento observável
      (nº de fetches) e não o valor da opção — que é o jeito certo de testar isto.
  verificacao_2_guardapronta:
    codigo: >
      `:362` — `disabled={lancarFaturamentos.isPending || !guardaPronta || lancamentosValidos.length === 0}`,
      e `:365-371` dá ao botão o mesmo rótulo-que-explica-o-disabled já usado por "Calcular"
      ("Verificando emissões…"). Fecha exatamente OBS-123-4b: antes, `disabled` só tinha
      `isPending`, então durante o carregamento/erro da guarda `elegiveis === clientes` e dava pra
      lançar faturamento (escrever no banco) para cliente que a guarda ia excluir.
    discriminancia_reproduzida: >
      Removi `|| !guardaPronta` do `disabled` (deixando o rótulo intacto, que é o cenário de
      regressão mais traiçoeiro — o botão continua *dizendo* "Verificando emissões…") e rodei o
      arquivo: **`2 failed | 19 passed (21)`**, e as duas falhas são precisamente
      "AC 5: lançar faturamento espera a guarda de duplicidade responder" e
      "AC 5: guarda que falhou também bloqueia o lançamento (falha fechada, não aberta)".
      Ou seja, os testes travam o `disabled` de verdade, não o texto. Restaurado em seguida.
    cobertura_dos_dois_modos: >
      Registro positivo: há teste para a guarda **pendente** (`mockComBoleto.mockReturnValue(new
      Promise(() => {}))`) **e** para a guarda **em erro** (`mockRejectedValue`). O segundo é o que
      importa — é ele que prova que o botão de lançar herdou o "falha fechada" do D-1 da 12.3, e não
      só o "aguarde". A inconsistência entre D-1 e D-2 apontada em OBS-123-4b está resolvida nos
      dois estados.
julgamento_resolucao_de_nomes_best_effort:
  pergunta: >
    A resolução de nomes de `falhas[]` é feita em uma query só, best-effort (cai pra `'—'` em vez
    de derrubar o lote). É escolha segura? Lançamentos bem-sucedidos podem ser perdidos por causa
    de uma falha ao buscar nomes?
  decisao: "SEGURA, e é a escolha certa. Lançamento bem-sucedido é impossível de perder por esta via."
  fundamentacao: >
    **Por que é impossível perder lançamento.** Os `upsert` já aconteceram e estão **commitados**
    antes de `resolverNomesDasFalhas` ser chamada (`:78-86`: o loop de lançamento termina, depois a
    resolução). A função é `Promise<void>`, **muta o array in-place** e envolve tudo num
    `try { … } catch { /* mantém o '—' */ }`. Não há `throw`, não há `return` alternativo, não há
    caminho em que `resultado.lancados` seja alterado. Rastreei também a única fonte de erro real
    (`listarClientesContabilidadePorIds` faz `throw new ApiError(500, …)` quando o Supabase devolve
    `error`) — e esse throw morre no `catch`. O contrato "o que já deu certo continua contado" é
    estrutural, não convencional.
    **E está travado por teste**, que é o que separa "é seguro hoje" de "continua seguro depois":
    `cliente-contabilidade-faturamento-repository.test.ts` tem o caso
    "busca de nomes falhando não derruba o lote — os lançamentos que deram certo continuam contados",
    com `estado.falhaAoBuscarClientes = true` e `expect(r.lancados).toBe(1)`. Alguém que "melhore" o
    catch para propagar o erro quebra esse teste na hora.
    **Por que a assimetria de custo está do lado certo.** Nome é *enfeite de mensagem*; lançamento é
    *escrita de receita*. Trocar uma escrita confirmada por uma mensagem bonita seria o inverso da
    prioridade. O fallback `'—'` é o mesmo já usado por `ExclusaoLoteResultado.bloqueados`, então o
    front não precisa de ramo novo e o operador nunca vê UUID cru (travado pelo teste do componente:
    `expect(screen.queryByText(/cc-2/)).not.toBeInTheDocument()`).
    **Por que "uma query só" e "só quando há falha" também estão certos.** `if (falhas.length === 0)
    return` antes de qualquer I/O: o caminho feliz — o normal — **não paga round-trip nenhum**, e
    isso está afirmado no teste (`expect(estado.buscasDeClientes).toBe(0)` no lote 100% ok, e
    `toBe(1)` na falha parcial, o que trava também a ausência de N+1). Reusa
    `listarClientesContabilidadePorIds`, que já existia — não é função nova para este caso.
  ressalva: "Ver OBS-124-4: o pior caso do `.in()` (200 ids) é justamente onde o best-effort é mais provável de ser exercido. O desenho já absorve, mas vale registrar."

# ─────────────────────────────────────────────────────────────────────────────
# Verificações pontuais e limitações
# ─────────────────────────────────────────────────────────────────────────────
limitacao_da_verificacao_manual:
  status: "NÃO EXECUTADA — nem pelo @dev, nem por mim. Registrado como limitação, não como item cumprido."
  o_que_a_story_pedia: >
    A seção "Complexidade e Riscos" da 12.4 diz textualmente: "@qa deve testar o caminho 'digitar
    valores → trocar competência → confirmar/cancelar' explicitamente". O @dev, honestamente,
    marcou `[ ]` na verificação manual do DoD e delegou.
  o_que_eu_fiz_de_fato: >
    **Não subi o app no navegador e não exercitei o fluxo à mão.** Este ambiente de revisão não tem
    navegador disponível. O que fiz no lugar: li o caminho inteiro no código, rodei os testes de
    componente (jsdom/Testing Library), executei o `next build` e — para não depender da leitura —
    **mutei o código** nos 4 pontos críticos para provar que os testes reagem. Não vou carimbar como
    feito o que não foi feito.
  o_que_a_cobertura_de_componente_compensa: >
    Boa parte, e de forma verificável. As 4 ramificações do AC 4 estão cobertas:
    (a) trocar com valores → campos limpos + confirmação com `nome: R$ valor`;
    (b) **Cancelar** → confirmação some, campos seguem vazios;
    (c) **Confirmar** → valores voltam **e o POST subsequente vai para a competência NOVA**
        (asserção de payload, a que realmente prova o `RS-3`);
    (d) sem valores digitados → troca direta, sem confirmação.
    A mutação do `setFaturamentos({})` prova que (a) não é vácuo.
  o_que_a_cobertura_de_componente_NAO_compensa:
    - >
      **Empilhamento visual do modal-dentro-de-modal.** jsdom não avalia `z-index` nem pintura. Os
      dois modais são `fixed inset-0 z-50`; o `ConfirmDialog` fica por cima só porque monta depois
      no DOM (é o 2º filho do fragmento). Se isso estivesse errado, **nenhum teste pegaria**. Risco
      avaliado como baixo por precedente, não por verificação: o mesmo par `Modal` → `ConfirmDialog`
      já roda em produção (`SyncModal`, citado em `Modal.tsx:31`) e a 12.3 já entregou
      `LoteContabilidadeDialog` → `LoteEmissaoDialog`.
    - >
      **Foco e ordem de leitura reais** ao abrir/fechar a confirmação. Por construção (`Modal.tsx:
      122-138`) o foco vai para o 1º focável do `ConfirmDialog` e volta ao gatilho (o `<input
      type="month">`) no unmount, e isso é território testado da 12.1 — mas não foi observado aqui.
    - >
      **O seletor nativo de `<input type="month">`** (incluindo o botão de limpar, que é o que
      produz OBS-124-3). `fireEvent.change` não é o mesmo que o picker do Chrome.
  recomendacao: >
    Uma passada manual de ~3 minutos antes do deploy, cobrindo só o que jsdom não vê: abrir o lote
    com ≥2 clientes de faixa, digitar valores, trocar o mês, e conferir **visualmente** que (i) a
    confirmação aparece POR CIMA do diálogo de lote e o campo de competência atrás não responde a
    clique, (ii) Escape e clique no backdrop fecham a confirmação deixando os campos vazios, e
    (iii) limpar o campo de mês não deixa a tela num beco (OBS-124-3). Nada disso é bloqueante para
    o gate — é confirmação de renderização, e a lógica já está travada por teste.
modal_dentro_de_modal:
  veredito: "Correto — e o cenário de 'trocar a competência com a confirmação aberta' é INALCANÇÁVEL, verificado no código."
  analise: >
    Fui atrás de um bug de estado que este desenho *poderia* ter: com o `ConfirmDialog` aberto, se o
    operador trocasse a competência **de novo**, o `trocaCompetencia.para` do diálogo ficaria
    obsoleto (o rótulo nomearia o mês errado). Rastreei e **não é alcançável**, por duas barreiras
    independentes: (1) o `ConfirmDialog` renderiza um backdrop `fixed inset-0` depois do `Modal` do
    lote no DOM, então o clique no `<input type="month">` de baixo atinge o backdrop; (2)
    `Modal.tsx:141-180` prende `Tab`/`Shift+Tab` dentro do painel do topo da `pilhaDeModais`, então
    o campo também não é alcançável por teclado. Registro o raciocínio porque a ausência do bug aqui
    depende do `pilhaDeModais` da 12.1 continuar existindo — quem mexer no `Modal` precisa saber
    que há consumidor dependendo disso.
episodio_do_build:
  veredito: "Falha de ambiente, NÃO de código. Build verde confirmado."
  o_que_aconteceu: >
    Meu 1º `npm run build` saiu com exit 1 e
    `Error: EINVAL: invalid argument, readlink '…\\apps\\web\\.next\\server\\app-paths-manifest.json'`,
    com o stack inteiro dentro de `next/dist/lib/recursive-delete.js` — ou seja, o Next falhou
    **limpando o `.next` antigo**, antes de compilar uma linha. É o sintoma conhecido de artefato
    stale em pasta sincronizada por OneDrive (reparse point / placeholder de nuvem), e este
    repositório vive em `C:\Users\carme\OneDrive\…`. Apaguei o `.next` e rodei de novo:
    **exit 0**, `✓ Compiled successfully`, `✓ Generating static pages (59/59)`.
    Registro em vez de omitir, porque quem repetir a verificação vai esbarrar nisso.
  avisos_do_build: >
    `⚠ Compiled with warnings` é **pré-existente e de terceiro**: `@supabase/realtime-js/…/
    websocket-factory.js` usa `process.versions`, não suportado no Edge Runtime. Nada a ver com esta
    story e presente em qualquer build do repositório.
  metrica_verificavel: >
    Seguindo a recomendação que eu mesma deixei em OBS-123-6 (parar de citar "N rotas"): **0 rotas
    adicionadas, 0 removidas** — `git ls-tree -r --name-only` conta 77 `route.ts` em `382a366~1` e
    77 em `382a366`. `ƒ /api/clientes-contabilidade/faturamentos/lote` continua server-rendered on
    demand no build.
analise_do_flake_relatado:
  relato_do_dev: >
    "1ª execução teve 1 falha por timeout de 5s em `tests/server/gateway/boleto-emissao.test.ts`
    ('retorna 403 quando feature flag está desligada'). Rodado isolado: 11/11 verde; 2ª execução
    completa: 133/133 verde. Flake de contenção de CPU, não regressão."
  eu_reproduzi: "NÃO. Rodei a suíte inteira duas vezes e obtive 133/1201 verde nas DUAS. O flake não apareceu para mim em nenhuma das execuções."
  veredito: "Atribuição do @dev ACEITA como não-relacionada — sustentada por evidência estrutural, não por confiança."
  fundamentacao: >
    Não me contentei com "não reproduzi, então tudo bem" — isso deixaria em aberto se o flake é
    consequência desta story. Três fatos independentes fecham a questão:
    · **Sem interseção de código.** O diff de `382a366` toca 3 arquivos de `apps/web/src`
      (`LoteContabilidadeDialog.tsx`, `services/clientes-contabilidade.ts`,
      `cliente-contabilidade-faturamento-repository.ts`). O teste flakeado exercita
      `@/app/api/boletos/emitir/route` — caminho de emissão de boleto, sem nenhuma aresta com
      lançamento de faturamento contábil. `git log` do arquivo de teste: último toque em `0d4bf47`
      ("emissao em lote com idempotencia corrigida"), muito antes do Épico 12.
    · **A forma do teste explica o timeout sem precisar de regressão.** É o **primeiro `it` do
      arquivo** e a primeira coisa que ele faz é `await import('@/app/api/boletos/emitir/route')` —
      um import dinâmico que força o Vite a transformar o grafo inteiro da rota do Next **dentro**
      do timeout de 5s do próprio teste. É o formato clássico de custo de cold start atribuído ao
      caso de teste em vez do setup; sob contenção de CPU, estoura.
    · **O total nunca mudou.** 1201 testes nas duas execuções minhas e na 2ª do @dev — o flake é de
      *tempo*, não de contagem ou de asserção.
    Não recomendo ação. Se voltar a incomodar, o conserto é mover o `await import` para um
    `beforeAll` ou dar `testTimeout` maior a esse arquivo — mas isso é higiene de suíte, não desta
    story, e não vou inflar o escopo da 12.4 com isso.
contencao_rs9:
  veredito: "ÍNTEGRA. A 12.5 está liberada para abrir."
  analise: >
    A "Nota de sequenciamento (RS-9)" da 12.5 exige que a 12.4 feche o gate de @qa antes. Este gate
    está fechado, com `PASS` e **sem rework pendente para o @dev**. Ordem mantida:
    **12.3 → 12.4 → 12.5 → 12.6** (+ 12.8), com a fila estendida do arquivo (12.12 / 12.15 / 12.16 /
    12.17) inalterada.
    Conferi que a 12.4 **não invadiu** o escopo de quem vem depois:
    · **12.5** — o bloco "Pronto pra calcular N clientes" (`:376-383`) está **intacto**, palavra por
      palavra; é literalmente o que a AC 1 da 12.5 vai substituir pelo resumo de composição. Nenhuma
      barra de progresso, nenhum `ProgressoExecucao`, nenhum toque no card "Total" (`:400-403`, que
      é a AC 4 da 12.5).
    · **12.15** — nenhum contador "X de Y preenchidos", nenhuma ordenação por pendentes, e o
      `max-h-52` da lista (`:340`) segue exatamente como estava (AC 3 da 12.15). O rótulo
      "Digite ao menos um faturamento" **não** é o contador da AC 1 da 12.15: é rótulo de estado
      desabilitado, binário, não progressivo. Não colide.
    · **12.12** — nenhum `role="status"`/`role="alert"` novo foi adicionado (ver DEB-12.4-C, que é
      justamente o efeito colateral disso).
    · **12.6** — nenhum tratamento de erro-vs-vazio novo nos pontos de carga.
    Positivo para a 12.5: o estado que a 12.4 introduziu (`ultimoLancamento`, `pendentesRetry`) é
    exatamente o insumo de que a AC 1 da 12.5 precisa para escrever
    "X em faixa de faturamento (**Y lançado · Z pendente**)". A 12.4 não só não atrapalhou como
    deixou o dado pronto.

# ─────────────────────────────────────────────────────────────────────────────
decisoes_do_dev_avaliadas:
  - id: D-1
    assunto: "AC 4 implementada como 'limpa E pergunta' em vez de 'limpa OU pergunta'"
    veredito: ACEITA
    justificativa: "Ver `julgamento_ac4_limpa_e_pergunta` — desenho dominante, alinhado ao princípio de modo de falha já aprovado na 12.3 (D-1), com 3 ressalvas registradas."
  - id: D-2
    assunto: "Resolução de `nome` no repositório (1 query, só quando há falha, best-effort com `'—'`)"
    veredito: ACEITA
    justificativa: >
      Ver `julgamento_resolucao_de_nomes_best_effort`. Acrescento o que o @dev não registrou e que
      reforça a decisão: resolver no **servidor** (e não no front, que já tem os nomes na tela) é o
      que mantém o contrato correto para qualquer consumidor futuro da rota — o front só conhece os
      clientes da seleção atual, e uma falha pode, em teoria, vir de um id que não está mais na
      lista renderizada (ex.: cliente removido da seleção entre o clique e a resposta). Resolver no
      front teria produzido `undefined` exatamente nesse caso.
  - id: D-3
    assunto: "[AUTO-DECISION] Botão desabilitado com rótulo 'Digite ao menos um faturamento' quando não há valor válido"
    veredito: ACEITA
    justificativa: >
      Raciocínio correto e confirmado na fonte: `lancarFaturamentoLoteSchema` tem
      `.min(1, 'Informe ao menos um lançamento')`, então lista vazia produzia um **422 morto** — e,
      sob a regra nova do AC 1, um 422 nunca faria o passo avançar de qualquer jeito. Trocar um erro
      inútil por um estado desabilitado que **diz o que falta** é melhora estrita, e segue o padrão
      de rótulo-que-explica-o-disabled que a 12.3 já estabeleceu no botão "Calcular".
      Verifiquei que não engole o caso legítimo de `faturamento = 0`: o filtro é
      `faturamentos[id]?.trim() && !Number.isNaN(…) && l.faturamento >= 0`, ou seja, `"0"` digitado
      é **válido** (`trim()` de `"0"` é truthy). Só string vazia é excluída. Correto — zero é um
      faturamento possível.
  - id: D-4
    assunto: "[AUTO-DECISION] Bloco de falhas visível apenas enquanto `!execucaoId`"
    veredito: ACEITA — com correção de comentário pendente (OBS-124-1)
    justificativa: >
      A **decisão** está certa e por um motivo que o @dev não chegou a escrever: depois do cálculo,
      quem teve o faturamento não lançado aparece no painel de resultados como `alerta`, com nome e
      motivo (`:405-415`, `<strong>{r.nome}</strong>: {r.alertas[0]}`). Ou seja, a informação **não
      se perde** — ela muda de forma, e a forma nova é a autoritativa (vem do cálculo, não do
      lançamento). Manter os dois blocos ao mesmo tempo é que seria confuso, e um "Tentar de novo"
      pós-cálculo seria inócuo (lançar faturamento depois não muda resultado já produzido).
      O que **não** está certo é o comentário `:305-308`, que promete o contrário do que o código
      faz. Ver OBS-124-1.
  - id: D-5
    assunto: "Rota `faturamentos/lote/route.ts` mantida na File List como 'verificado, sem alteração'"
    veredito: ACEITA — e é a forma certa de registrar
    justificativa: >
      A File List proposta trazia a rota com a ressalva "se necessário repassar `nome`". O @dev
      verificou, concluiu que não era necessário (`Response.json(resultado)` repassa o objeto
      inteiro) e **manteve a linha no registro marcando-a como verificada-sem-alteração**, em vez de
      apagá-la silenciosamente. Confirmei o fato (a rota não está no `--name-only`; 77 → 77 arquivos
      de rota). Registrar "olhei e não precisou" é mais útil que uma File List enxuta, porque impede
      o próximo revisor de refazer a mesma investigação.

