  - id: OBS-124-7
    severity: info
    category: process
    status: verificado-sem-acao
    titulo: "Registro positivo: o @dev marcou `[ ]` na verificação manual em vez de assumir que build verde equivale a fluxo testado"
    description: >
      Registro porque é o comportamento que eu quero ver repetido. O DoD da story tinha um item de
      verificação em navegador; o @dev **não o marcou**, escreveu explicitamente "não subi o app
      local nem exercitei o fluxo no browser" e delegou ao @qa o caminho que a própria story pedia.
      A alternativa comum — marcar `[x]` porque "os testes passam e o build compila" — é como um
      gate acaba assinando cobertura que não existe.
      A honestidade tem um custo real e ele está registrado em `limitacao_da_verificacao_manual`: eu
      **também** não pude rodar o navegador, então o item continua em aberto. Um `[x]` falso teria
      fechado o assunto com uma mentira; o `[ ]` honesto o mantém visível para quem fizer o deploy.
    recommendation: "Nenhuma. Manter o padrão."

# ─────────────────────────────────────────────────────────────────────────────
qualidade_dos_testes:
  veredito: "Discriminantes por prova, não por alegação — 4/4 mutações produziram exatamente as falhas esperadas"
  analise: >
    **+15 testes** (11 de componente + 4 de repositório), batendo com o Change Log e com o delta que
    eu mesma medi contra o gate da 12.3 (1186 → 1201). Arquivo do diálogo: **21 casos**.
    · **Prova de discriminância, o item mais importante deste bloco.** Não confiei na afirmação do
      @dev nem na minha leitura: mutei o `src` em 4 pontos independentes e rodei. Resultado:
      `if (resultado.lancados === 0)` → `if (false)` ⇒ **1 falha**, "AC 1: 100% de falha NÃO avança";
      remover `setFaturamentos({})` ⇒ **1 falha**, "AC 4: … limpa os campos e pede confirmação";
      remover `staleTime: 0` ⇒ **1 falha**, "AC 5 (DEB-12.3-B) … reabrir o diálogo revalida";
      remover `|| !guardaPronta` do `disabled` ⇒ **2 falhas**, os dois casos de AC 5.
      Em nenhuma das 4 houve falha colateral nem falha a menos: o mapeamento AC↔teste é **exato**.
      Árvore restaurada com `git checkout --` após cada mutação; `git status -- apps/web` vazio ao
      final.
    · **A mutação do `guardaPronta` foi desenhada para pegar teste preguiçoso** — removi só o
      `disabled`, deixando o **rótulo** "Verificando emissões…" intacto. Um teste que verificasse
      apenas o texto teria passado. Os dois falharam, ou seja, eles afirmam `toBeDisabled()` e a
      não-chamada do mock, não a aparência.
    · **Asserção sobre payload, não sobre estado interno.** O teste do AC 3 usa
      `toHaveBeenNthCalledWith(2, '2026-06', [{ clienteContabilidadeId: 'cc-2', … }])` e o do AC 4
      (confirmar) usa `toHaveBeenCalledWith('2026-07', …)`. Nos dois casos a asserção mira o que sai
      para o servidor — que é onde `RS-3` e o reenvio indevido se materializam. É a camada certa.
    · **Trava de ausência preservada e ampliada.** Os `not.toBeInTheDocument()` do Cenário A da 12.3
      (`:123-124`) continuam intactos, e a 12.4 acrescenta os seus:
      `queryByText(/cc-2/)` (nenhum UUID cru vaza para a tela, AC 2),
      `queryByText('Padaria Bom Pão Ltda')` ausente após o retry (AC 3 — prova que o já-lançado
      **não** volta), `queryByText(/Pronto pra calcular/i)` ausente com 0 lançados (AC 1).
      Testar o que **não** deve aparecer continua sendo a parte cara e ela está feita.
    · **Contadores como asserção de arquitetura.** No repositório, `estado.buscasDeClientes` é
      afirmado `toBe(0)` no caminho feliz e `toBe(1)` na falha parcial. Isso trava três coisas de uma
      vez: que o caminho feliz não paga round-trip, que não há N+1, e que a resolução acontece. Um
      contador no fake é mais barato e mais durável que espiar chamadas de mock.
    · **Modo de falha testado nos dois estados.** Guarda pendente (`new Promise(() => {})`) e guarda
      em erro (`mockRejectedValue`), mais a falha da busca de nomes no repositório. A parte mais
      delicada do desenho é a mais coberta — proporção correta, igual à que elogiei na 12.3.
    · **Lacuna correspondente aos achados:** Escape e backdrop do `ConfirmDialog` (OBS-124-2) e o
      estado de competência vazia (OBS-124-3). Nos dois casos o comportamento é derivável do código,
      mas não está travado.
nfr_validation:
  security:
    status: PASS
    notes: >
      Nenhuma rota nova, nenhuma mudança de papel: `POST /clientes-contabilidade/faturamentos/lote`
      segue com `requireRole(['admin','colaborador','financeiro'])` e o schema Zod inalterado
      (`competenciaSchema` + `uuid()` + `number().min(0)` + `min(1).max(200)`) — confirmei que o
      arquivo da rota e o de validação **não estão no diff**.
      A mudança de contrato é **aditiva e de saída**, e o campo novo é `nome` de cliente contábil —
      dado que os três papéis já enxergam na própria tela que originou a chamada, e que só é
      resolvido para ids que o próprio chamador enviou (`falhas.map(f => f.clienteContabilidadeId)`).
      Não há enumeração possível: um id que não veio no payload nunca entra na consulta.
      Sem SQL cru (`.in()` parametrizado do builder Supabase). Nenhum `dangerouslySetInnerHTML`; os
      dados interpolados no JSX novo (`f.nome`, `f.motivo`, `nome`, `brl(numero)`) são todos
      escapados pelo React. O `catch {}` de `resolverNomesDasFalhas` **não** vaza mensagem de erro
      para a resposta — engole e mantém `'—'`, que é o comportamento certo do ponto de vista de não
      expor detalhe de banco ao cliente.
  performance:
    status: PASS
    notes: >
      O único I/O novo é **condicional e único**: 1 query a `clientes_contabilidade` apenas quando
      `falhas.length > 0`, com asserção de teste garantindo 0 consultas no caminho feliz. Não há
      N+1. No cliente, `staleTime: 0` na `comBoletoQ` aumenta a frequência de refetch **de propósito**
      (é o conteúdo do AC 5) e o custo é 1 GET numa tabela pequena por montagem do diálogo —
      contrapartida correta para fechar a janela de dado obsoleto de `RS-1`. O global de 30s segue
      intocado, então nenhuma outra tela paga por isso.
      Os derivados novos (`alvosFaturamento`, `lancamentosValidos`) são `useMemo` O(n) sobre uma
      seleção limitada a 200 pelo schema. `next build` exit 0 após limpar o `.next`
      (ver `episodio_do_build`), sem alerta de tamanho de bundle.
  reliability:
    status: PASS
    notes: >
      **É aqui que a story ganha o gate**, e é a NFR que estava em CONCERNS na 12.3. Três melhoras
      concretas de confiabilidade, todas travadas por teste discriminante: (a) o passo 1 deixou de
      declarar sucesso sobre 100% de falha — o bug de fluxo do `RS-3` está morto; (b) o lançamento
      em massa herdou o modo de falha fechada da guarda (`|| !guardaPronta`), resolvendo a
      contradição entre D-1 e D-2 que eu registrei em OBS-123-4b; (c) a janela de cache de cliente
      da guarda (camada 2 do resíduo de `RS-1`, OBS-123-2) foi fechada com `staleTime: 0`.
      A degradação da resolução de nomes é graciosa por construção e por teste: falha ao buscar nome
      **nunca** custa um lançamento confirmado.
      `tsc`, lint, **2× 1201 testes** e build, todos reexecutados por mim, todos verdes. Resíduos:
      OBS-124-3 (rótulo falso na competência vazia, recuperação óbvia) e as duas saídas do
      `ConfirmDialog` sem trava de teste (OBS-124-2) — nenhum dos dois é modo de falha novo.
      **`RS-1` continua REDUZIDO, NÃO FECHADO**: esta story fechou a *camada 2* das três descritas em
      `DEB-12.3-A`; as camadas 1 (corrida entre abas) e 3 (calcular→calcular→emitir) seguem abertas e
      sem dono.
  maintainability:
    status: PASS
    notes: >
      Reuso em vez de invenção nos três pontos onde havia tentação: `ConfirmDialog` (AC 4, com o
      `tone="neutral"` correto), o padrão visual de `ClientesContabilidadeManager` (AC 2) e
      `listarClientesContabilidadePorIds`, que já existia. Zero componente novo, zero utilitário
      novo, zero token.
      Os comentários novos explicam **por quê**, não o quê — o de `:305-308` sobre bloco persistente
      vs. toast, o de `:100-101` sobre por que lista vazia é bloqueada antes do 422, o JSDoc de
      `resolverNomesDasFalhas` sobre por que o `catch` é vazio de propósito. Comentário que justifica
      um `catch` silencioso é exatamente o que impede a próxima pessoa de "consertá-lo" propagando o
      erro (e quebrando o teste que existe para isso).
      As duas `[AUTO-DECISION]` e o `Fora de escopo confirmado` estão registrados no Dev Agent
      Record com razão declarada, o que torna a próxima revisão barata.
      Débito de manutenção real e único: OBS-124-1, o comentário que promete persistência que o
      `!execucaoId` nega.

