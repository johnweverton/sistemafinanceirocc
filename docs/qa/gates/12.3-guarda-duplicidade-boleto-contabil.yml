# ─────────────────────────────────────────────────────────────────────────────
# Os dois pontos que a lead pediu explicitamente que eu julgasse
# ─────────────────────────────────────────────────────────────────────────────
julgamento_falha_fechada:
  pergunta: >
    A guarda falha FECHADA (sem resposta da rota → cálculo bloqueado), divergindo do espelho do
    lado médico (`NovaExecucao.tsx`), que deixa o disparo seguir se a consulta de médicos falhar.
    Divergência aceitável ou deveria ter seguido o padrão do médico por consistência?
  decisao: ACEITA — a divergência está CERTA e o lado médico é que está errado
  status: "Decidido nesta revisão. Não é ambiguidade, não volta para o @dev, não reabre a 12.3."
  fundamentacao: >
    Quatro razões independentes, em ordem de peso:

    **1. É a única leitura não-vazia da AC 4.** A AC 4 diz que os já cobertos são "removidos do
    payload **antes** do cálculo". Se a consulta não respondeu, o conjunto de "quem remover" é
    desconhecido — não vazio, *desconhecido*. Tratar desconhecido como vazio e seguir não é
    "cumprir a AC de forma mais permissiva", é **não cumprir a AC** enquanto exibe a aparência de
    tê-la cumprido. Uma guarda que abre no timeout é pior do que guarda nenhuma, porque cria
    confiança onde não há proteção.

    **2. A direção da falha está anticorrelacionada com o risco.** O `com-boleto` falha justamente
    quando o banco está lento ou sob carga — que é exatamente quando o operador clica duas vezes,
    reabre a aba, ou "acha que não foi". Falhar aberto entrega a proteção precisamente na janela em
    que ela é mais necessária. Verifiquei que essa não é hipótese abstrata: o `POST .../lote` tem
    `maxDuration = 300` e um rate limiter de 3/min — o desenho já assume que esse fluxo demora e
    que o operador reincide.

    **3. A assimetria de custo é gritante e favorece o fechado.** Falso positivo do fechado =
    operador espera / fecha e reabre o modal (minutos, reversível, visível). Falso negativo do
    aberto = boleto duplicado emitido no gateway, que exige cancelamento junto à Cora, com o
    cliente já tendo recebido a cobrança (irreversível do lado de fora, e é literalmente o `RS-1`
    que motiva a existência desta story). Numa story cuja razão de ser é reduzir risco financeiro,
    escolher o modo de falha que preserva o risco seria autocontraditório.

    **4. O argumento de consistência não se sustenta, e é aqui que a decisão vira interessante.**
    Consistência só é um valor quando o padrão de referência é uma **decisão**. Fui ver
    `NovaExecucao.tsx:177-185` e o comportamento de lá é `const { data: medicosComBoletoData } =
    useQuery({...})` — **sem `isSuccess`, sem `isError`, sem gate algum**; o `Set` vazio no
    `?? []` do `useMemo` é o que faz o disparo seguir. Ou seja, o "falha aberta" do lado médico não
    é um padrão adotado: é a **consequência não examinada** de desestruturar só `data`. Não há
    comentário, não há teste, não há linha de story que decida isso. Espelhar uma não-decisão não
    é consistência — é propagar um defeito com a desculpa de simetria. O @dev fez o certo em (a)
    divergir, (b) **não** "consertar" o fluxo médico de passagem (fora de escopo, e mexer em
    `NovaExecucao.tsx` acionaria o `RS-8`/rebase) e (c) registrar a assimetria em vez de
    silenciá-la.

    Reforço material: a decisão não ficou só na UI. O repositório propaga `ApiError 500` em vez de
    devolver `Set` vazio, e existe teste explícito para isso ("erro do banco → propaga ApiError 500
    (não devolve vazio, que abriria a guarda)"). Fechar em uma camada e abrir na outra teria sido
    fechar em lugar nenhum.
  ressalvas_que_acompanham_a_aceitacao:
    - >
      Escolher falhar fechado **cria uma obrigação nova** que esta story não entregou: um caminho
      de recuperação. Rastreei o estado de erro no código: `guardaPronta` vira `false`,
      `clientesComBoletoAtivo` volta a ser um `Set` vazio, logo `elegiveis === clientes` e o botão
      é renderizado **desabilitado com o rótulo "Verificando emissões…"** — rótulo que, depois das
      3 tentativas do React Query, é literalmente falso, porque nada mais está sendo verificado. Ao
      lado dele há um `<p className="alert-error">` estático, sem "Tentar novamente". A única saída
      é fechar e reabrir o modal, o que funciona mas é descoberto por tentativa e erro. Ver
      OBS-123-4a e o roteamento para 12.6.
    - >
      A decisão D-1 (falha fechada) e a decisão D-2 (faturamento também filtrado) **se contradizem
      exatamente no estado em que D-1 está ativa**: durante o carregamento e no erro, o passo de
      lançamento de faturamento em massa continua liberado sobre a lista inteira, porque o botão
      dele não tem gate de `guardaPronta`. Ver OBS-123-4b.
    - >
      A assimetria com o fluxo médico agora tem um dono implícito e nenhum dono explícito: depois
      desta story, o caminho **médico** é o menos seguro dos dois. Roteado como DEB-12.3-C.
julgamento_rs1_reduzido:
  pergunta: >
    A checagem é client-side (consulta antes de calcular), então duas abas abrindo o mesmo lote
    quase ao mesmo tempo ainda podem ambas passar. Aceitável para esta story ou deveria vir
    acompanhada de guarda transacional/idempotente no servidor?
  decisao: >
    ACEITÁVEL AGORA, EXPLICITAMENTE INCOMPLETO — e a janela residual real é MAIOR do que a story
    documenta. `RS-1` fica **reduzido, não fechado**, e este gate proíbe qualquer story/PR/métrica
    do Épico 12 de declará-lo eliminado.
  status: "Débito técnico registrado (DEB-12.3-A + DEB-12.3-B). Não implementar aqui."
  fundamentacao: >
    **Por que aceitável agora:** o desenho client-side foi **pré-autorizado pelo @po** na "Nota de
    escopo do guard" ([AJUSTE @po 2026-08-25]), com a instrução literal "Fechar o resíduo
    (constraint/guard de servidor por `(cliente, competência)`) é story nova e depende de decisão
    do dono; **não** implementar aqui por iniciativa própria". O @dev obedeceu. Cobrar guarda
    transacional neste gate seria reprovar a story por não fazer o que o @po proibiu de fazer — e,
    pior, incentivaria o próximo @dev a inventar constraint de banco por conta própria numa tabela
    de produção (`boletos`/`execucao_resultados`), que é como se cria incidente de migration.
    Além disso, a guarda entregue **cobre o caso comum de verdade**: "rodei o lote e não lembro se
    já tinha rodado" é sequencial, não concorrente, e é o caso que o achado original de 2026-08-04
    descreve (coordenadora financeira emitiu individual e ia rodar o lote em seguida).

    **Por que explicitamente incompleto, em três camadas — a 2ª e a 3ª ninguém tinha registrado:**

    · *Camada 1 (documentada pelo @po):* corrida entre a consulta e o `POST .../lote`. Duas abas /
      dois operadores. Mitigação parcial que vale registrar e que não estava escrita em lugar
      nenhum: o `POST .../lote` tem rate limiter de **3/min por `userId`**, o que estreita o caso
      "mesmo operador, duas abas" mas não faz nada contra dois operadores distintos.

    · *Camada 2 (achado desta revisão — OBS-123-2):* a janela **não** é "entre a consulta e o
      POST". `app/providers.tsx:10` define `defaultOptions: { queries: { staleTime: 30_000,
      refetchOnWindowFocus: false } }` **globalmente**. O comentário do @dev no componente diz
      "Sem `staleTime` de propósito — precisa refletir uma emissão feita há segundos" e isso é
      **factualmente falso**: a query herda 30s de staleTime, e com `refetchOnWindowFocus: false`
      um diálogo que fique aberto não revalida nunca. A janela real é "desde o último fetch/
      invalidação até o clique", que pode ser arbitrariamente longa. O `force-dynamic` da rota
      (AC 1) elimina o cache **HTTP**, não o cache **do cliente** — são coisas diferentes e a
      story trata as duas como se fossem a mesma.

    · *Camada 3 (achado desta revisão — OBS-123-1):* a guarda é chaveada em **boletos**, então ela
      não cobre "calcular → calcular de novo → emitir os dois". Isso não é concorrência, é
      sequencial e plausível.

    Nenhuma das três é regressão introduzida por este commit — a 1 é escopo declarado, a 2 é
    default global herdado (o fluxo médico tem o mesmo) e a 3 é consequência do mecanismo que a
    própria AC 2 prescreve. Mas juntas elas significam que a frase "reduzido ao mesmo nível de
    risco residual já aceito no fluxo médico" está **correta na comparação e otimista na
    magnitude**.
  registro_obrigatorio: >
    `RS-1` = **REDUZIDO, NÃO FECHADO**. Ao consolidar o Épico 12, o texto de saída deve ser:
    "guarda de cliente contra reemissão sequencial na mesma competência; sem guarda transacional
    de servidor; resíduo em corrida entre abas, em janela de cache de cliente e na sequência
    calcular-calcular-emitir". Se alguém escrever "RS-1 fechado", este gate é a contraprova.

