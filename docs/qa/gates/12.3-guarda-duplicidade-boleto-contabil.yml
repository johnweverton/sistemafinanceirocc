qualidade_dos_testes:
  veredito: "Testes de comportamento, não de implementação — com uma cobertura que trava a AUSÊNCIA, que é a parte difícil"
  analise: >
    22 testes novos (6 rota + 6 repositório + 10 componente), batendo com o "+22" do commit e com o
    delta 1164 → 1186 que eu mesma medi contra o gate da 12.2.
    · **Travar ausência, não só presença.** Três asserções fazem o trabalho pesado do Cenário A e
      merecem registro: `expect(statusFiltrados).not.toContain('cancelado')` /
      `not.toContain('falha')` no repositório, e `queryByRole('checkbox')` +
      `queryByText(/emitir mesmo assim/i)` ambos `not.toBeInTheDocument()` no componente. Testar
      que algo **não** existe é o único jeito de impedir que um opt-in volte por conveniência numa
      story futura — e a 12.4/12.5/12.6/12.8 vão todas reabrir este arquivo. É a asserção mais
      valiosa do conjunto.
    · **Teste do modo de falha, não só do caminho feliz.** Dois testes dedicados a D-1 ("enquanto a
      checagem não responde…" com `new Promise(() => {})`, e "falha na checagem também bloqueia o
      cálculo") + o teste de `ApiError` no repositório. A decisão de arquitetura mais delicada da
      story é a que tem mais cobertura — proporção correta.
    · **O teste de 2 rodadas é honesto no que simula.** `unmount()` entre as rodadas e
      `QueryClient` novo: simula duas sessões, não um `refetch`. É mais forte que a alternativa
      (não reaproveita cache) e a intenção está no comentário. O que ele não cobre está em
      OBS-123-1, e é limitação do mecanismo, não do teste.
    · **Teste de troca de competência com `mockImplementation` por argumento** — verifica que a
      `queryKey` realmente rechaveia, e não só que a função foi chamada de novo. Diferença sutil e
      correta.
    · **`expect(screen.getByText(/^1 cliente no modo/))` + `getAllByRole('spinbutton')` com length 1**
      é a prova de D-2 pelo lado observável (um campo numérico, não dois), não pelo estado interno.
    · Lacuna correspondente aos achados: nada exercita o passo de faturamento **durante** o estado
      de guarda pendente/erro (OBS-123-4b), e nada cobre a sequência calcular-calcular-emitir
      (OBS-123-1) — nos dois casos porque não há código a cobrir.
nfr_validation:
  security:
    status: PASS
    notes: >
      `requireRole(['admin','colaborador','financeiro'])` na rota nova, idêntico ao espelho.
      Assimetria conferida e considerada correta: `POST /clientes-contabilidade/lote` exige
      `['admin','colaborador']` (mais restrito), então `financeiro` pode **consultar** quem já tem
      boleto mas não pode disparar lote — leitura é superconjunto de escrita, que é a direção
      segura, e `financeiro` já enxerga esses dados em Recebíveis. Sem SQL cru: a query usa o
      builder do Supabase com `.in()`/`.eq()` parametrizados. Competência validada por regex Zod
      antes de tocar o repositório (teste cobre 400 sem chamar o banco). Nenhum
      `dangerouslySetInnerHTML`; o único dado interpolado no JSX é `c.nome`, escapado pelo React.
      A resposta expõe apenas UUIDs, sem nome nem valor.
  performance:
    status: PASS
    notes: >
      Uma query a mais por abertura de diálogo, sobre `boletos` com `!inner` duplo e filtro por
      competência — mesma forma da consulta de médicos que já roda em produção, e a tabela é
      pequena (~120 boletos/mês, número da própria migration 0037). `force-dynamic` é exigência
      funcional da AC 1, não descuido. `next build` exit 0, sem alerta de tamanho; o único código
      de cliente novo é o `useMemo` de partição, O(n) sobre a seleção (limitada a 200 pela
      `max(200)` do schema do lote). Ver OBS-123-2 para a discussão de cache, que é de correção e
      não de performance.
  reliability:
    status: CONCERNS
    notes: >
      O modo de falha escolhido é o correto (fechado, ver `julgamento_falha_fechada`) e está
      testado nas duas camadas. O que rebaixa para CONCERNS é o conjunto: sem caminho de retry
      (OBS-123-4a), com o passo de faturamento fora do gate (OBS-123-4b), com janela de dado
      obsoleto maior que a documentada (OBS-123-2) e com uma sequência de uso plausível que a
      guarda não vê (OBS-123-1). Nenhum é regressão; todos afetam quanto se pode confiar na
      guarda. `tsc`, lint, 1186 testes e build verdes, todos reexecutados por mim.
  maintainability:
    status: PASS
    notes: >
      Espelhamento deliberado e assumido: a função nova é reconhecível como cópia da de médicos, o
      que é a decisão certa aqui (FKs diferentes impedem reuso, e o épico mandou copiar o padrão,
      não a função). O JSDoc explica **por que** `buscarBoletoEmitido` não resolve o caso — a
      informação que evita a próxima pessoa "otimizar" a função para fora. O `CheckCircleIcon`
      inline vem com comentário justificando por que não foi consolidado, o que impede a discussão
      de se repetir. Débito de manutenção real: dois comentários que afirmam garantia inexistente
      sobre cache (OBS-123-2), aqui e em `NovaExecucao.tsx`.

