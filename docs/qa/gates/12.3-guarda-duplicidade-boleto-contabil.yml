decisoes_do_dev_avaliadas:
  - id: D-1
    assunto: "O guard falha FECHADO, não aberto (divergência consciente do espelho de médicos)"
    veredito: ACEITA
    justificativa: "Ver `julgamento_falha_fechada` acima — decisão registrada, com 2 ressalvas roteadas (OBS-123-4, DEB-12.3-C)."
  - id: D-2
    assunto: "A guarda filtra também o lançamento de faturamento em massa (`faixaFaturamento` deriva de `elegiveis`)"
    veredito: ACEITA COM RESSALVA
    justificativa: >
      O raciocínio está certo e a consequência é boa: `clientes_contabilidade_faturamentos` tem
      `unique (cliente_contabilidade_id, competencia)` (migration 0031), então lançar faturamento
      de quem já foi cobrado é, no melhor caso, ruído, e no pior caso sobrescreve o valor que
      originou a cobrança que já existe. É consequência direta da AC 4, não escopo extra —
      concordo com o enquadramento.
      **Ressalva:** a filtragem só vale no caminho de sucesso. Enquanto `comBoletoQ` está
      carregando ou falhou, `clientesComBoletoAtivo` é um `Set` vazio, logo `elegiveis === clientes`
      e `faixaFaturamento` volta a ser a lista inteira — e o botão "Lançar faturamentos e
      continuar" (`:258-265`) **não tem gate de `guardaPronta`**, ao contrário do botão de calcular
      (`:168`). Ou seja: exatamente no estado que D-1 protege, D-2 não protege. Baixo impacto
      (faturamento é registro de receita, não cobrança; e o lote não avança mesmo), mas as duas
      decisões precisam concordar entre si. OBS-123-4.
  - id: D-3
    assunto: "Título do modal conta a seleção INTEIRA (`clientes.length`); só botão e resumo contam `elegiveis`"
    veredito: ACEITA
    justificativa: >
      Argumento correto e bem posto: alinhar o título com `elegiveis` apagaria do cabeçalho
      justamente o fato que o bloco "Já emitido (N)" existe para tornar visível. O operador
      selecionou N; a subtração é explicada, não escondida. Bônus não registrado pelo @dev que
      conferi: manter `clientes.length` no título é o que preserva o **nome acessível** do diálogo
      estável — o teste da 12.1 `expect(await screen.findByRole('dialog')).toHaveAccessibleName(
      /Calcular em lote/)` continua verde sem alteração. Alinhar com `elegiveis` teria feito o
      nome acessível oscilar conforme a resposta da rota, o que é ruim para leitor de tela.
  - id: D-4
    assunto: "A quebra em `LoteEmissaoDialog.test.tsx` foi corrigida no mock, não contornada"
    veredito: ACEITA — verificada por reprodução independente
    justificativa: "Ver `regressao_12_1`. Reproduzi as 4 falhas com o arquivo do commit anterior contra o `src` atual e provei paridade exata de asserções (17/17, diff vazio de `it`/`describe`/`expect`)."
  - id: D-5
    assunto: "'Teste de integração de ponta a ponta' lido como o teste de componente de 2 rodadas"
    veredito: ACEITA
    justificativa: >
      O argumento decisivo do @dev está certo e merece ser preservado: um teste de servidor de 2
      disparos **falharia por design**, porque a "Nota de escopo do guard" do @po diz que não há
      guarda transacional no servidor nesta story. Escrever esse teste teria produzido ou um teste
      vermelho legítimo, ou — pior — um teste que "passa" afirmando uma garantia inexistente. Não
      escrever é a resposta certa. Confirmei também a premissa factual: não há harness de
      integração com banco no repositório (`tests/server/**` são todos com deps mockadas).
      O teste entregue simula as duas rodadas com `unmount()` entre elas e `QueryClient` novo, o
      que é uma simulação **mais forte** que a sessão contínua (não reaproveita cache).
      Nota complementar que fecha o buraco de leitura: a rodada dupla **dentro da mesma sessão**
      está estruturalmente impedida sem precisar de teste — `calcular.isPending` desabilita o botão
      em voo e o `setExecucaoId` do `onSuccess` faz o botão desaparecer. O caso que sobra é
      OBS-123-1, e esse nenhum teste cobre porque nenhum código cobre.
  - id: AUDITORIA-DA-SESSAO-ANTERIOR
    assunto: "@dev auditou linha a linha o diff pendente de uma sessão que caiu no limite de contexto antes de validar"
    veredito: ACEITA
    justificativa: >
      Registro porque é uma situação de processo que normalmente produz problema e aqui não
      produziu. Reconferi por conta própria os 4 pontos que o @dev diz ter auditado (espelhamento
      da rota, espelhamento do repositório, `elegiveis` no `dispararLote`, bloco fora do ramo
      `execucaoId`) e todos batem com o código. A postura de auditar em vez de refazer foi a certa;
      refazer teria produzido um diff maior e sem rastreabilidade contra as ACs.

# ─────────────────────────────────────────────────────────────────────────────
issues:
  - id: OBS-123-1
    severity: medium
    category: requirements
    status: debito-registrado
    titulo: "A AC 3 promete mais do que o mecanismo da AC 2 entrega: 'calcular → calcular de novo → emitir os dois' continua duplicando"
    description: >
      Achado desta revisão. A AC 3 diz: "Rodar o mesmo lote/competência duas vezes **não** produz
      dois boletos ativos para o mesmo cliente". A AC 2 prescreve o mecanismo: consultar a tabela
      **`boletos`**. As duas só coincidem quando existe um boleto entre as duas rodadas.
      Sequência que passa inteira pela guarda, rastreada por mim no código:
      (1) operador calcula o lote de 2026-08 → cria execução E1 com N `execucao_resultados`,
      **nenhum boleto ainda** (o boleto só nasce na emissão);
      (2) operador não emite — fecha o modal, ou se distrai, ou não tem certeza se rodou;
      (3) calcula de novo → `com-boleto` devolve lista vazia (correto: não há boleto), ninguém é
      excluído, cria execução E2 com os mesmos N clientes;
      (4) depois, pela tela de execuções, emite E1 **e** E2 → dois boletos ativos para o mesmo
      cliente na mesma competência.
      Confirmei que nada barra o passo (4): `validarResultadoParaEmissao`
      (`server/emissao/emitir-boleto.ts:111-180`) valida status, valor, mínimo do gateway e dados
      do pagador — **nenhuma checagem por (cliente, competência)**; e a única idempotência
      persistida é o índice único `uq_boletos_resultado_ativo` **em `execucao_resultado_id`**
      (migration 0037), que por definição não vê duas linhas de resultado distintas.
      Não é desvio do @dev: ele implementou exatamente a AC 2, e a AC 2 é o mecanismo que o épico
      e a auditoria escolheram (espelho do fluxo médico, que tem a mesma limitação). É **defeito de
      especificação**: uma AC de resultado universalmente quantificada ("duas vezes → nunca dois
      boletos") em cima de um mecanismo que só cobre um subconjunto das sequências.
      Agrava o registro que o **teste da AC 3 codifica o subconjunto que funciona**: ele injeta o
      boleto de `cc-1` entre as rodadas (`mockComBoleto.mockResolvedValue({ clienteContabilidadeIds:
      ['cc-1'] })`) e então verifica a exclusão. É um bom teste do mecanismo, mas ele **define o
      problema para fora** — quem ler "AC 3 ✅, teste de 2 rodadas verde" vai concluir uma garantia
      mais forte do que existe.
    recommendation: >
      **Sem mudança de código na 12.3** (implementar cobertura de resultado seria justamente a
      guarda de servidor que o @po proibiu aqui). Duas ações de registro, ambas do @po:
      (a) corrigir a leitura da AC 3 no fechamento do épico para "não reenvia ao cálculo quem já
      tem boleto ativo na competência", que é o que o mecanismo garante;
      (b) incorporar esta sequência ao escopo de **DEB-12.3-A** (a story nova de guarda de
      servidor), porque uma constraint por `(cliente_contabilidade_id, competência)` sobre boletos
      ativos fecha as três camadas de resíduo de uma vez.
      Mitigação barata de UX, se o dono quiser algo antes: avisar no diálogo quando **já existe
      execução de lote para a competência** (o dado já está em `execucoes.competencia` +
      `clientes_contabilidade_lote`) — isso ataca o passo (3), que é o passo humano.
  - id: OBS-123-2
    severity: medium
    category: code
    status: debito-registrado
    titulo: "\"Sem cache\" vale para a rota, não para o cliente: `staleTime: 30_000` e `refetchOnWindowFocus: false` são defaults globais"
    description: >
      Achado desta revisão. O comentário em `LoteContabilidadeDialog.tsx:45` afirma "Sem
      `staleTime` de propósito — precisa refletir uma emissão feita há segundos", e a AC 1 / as
      Dev Notes tratam "sem cache" como resolvido pelo `force-dynamic`. Fui ler o que a query
      herda de verdade: `app/providers.tsx:10` define, para o app inteiro,
      `defaultOptions: { queries: { staleTime: 30_000, refetchOnWindowFocus: false } }`.
      Consequências:
      · o `useQuery` de `comBoleto` **tem** 30s de staleTime — "sem `staleTime`" significa "não
        sobrescrevi o default", não "sem cache";
      · com `refetchOnWindowFocus: false`, um diálogo aberto em segundo plano **nunca** revalida —
        o operador pode voltar à aba horas depois e clicar em Calcular sobre uma lista antiga;
      · `force-dynamic` elimina o cache **HTTP/CDN da rota**, que é uma camada diferente. Os dois
        são necessários; a story trata como se um resolvesse o outro.
      As invalidações explícitas do @dev (`fecharTudo` e `onAlgumEmitido`) cobrem o caminho
      principal — emitir e reabrir o diálogo enxerga os boletos novos, e isso está certo. O que
      não é coberto é emissão feita **por outro caminho** (emissão individual em
      `EmissaoCliente`/`GerarExecucao`, ou outro operador) dentro da janela de stale.
      **Não é regressão nem desvio:** `NovaExecucao.tsx` herda exatamente os mesmos defaults e tem
      exatamente o mesmo comentário. O problema é que o comentário **afirma uma garantia que não
      existe**, nos dois arquivos, e é o tipo de comentário que faz o próximo dev não investigar.
      Impacto direto na avaliação de `RS-1`: a janela residual não é "entre a consulta e o POST",
      é "desde o último fetch/invalidação até o clique".
    recommendation: >
      Correção de código é de uma linha e **não deve ser feita agora** (o arquivo está na fila
      `RS-9` e a próxima da fila é a 12.4): acrescentar `staleTime: 0` (e, se o dono quiser,
      `refetchOnWindowFocus: true` só nesta query) ao `useQuery` de `comBoleto` — passando a
      cumprir literalmente o que o comentário promete. Roteado para a **12.4** como DEB-12.3-B, que
      é a próxima story a abrir `LoteContabilidadeDialog.tsx` e portanto não gera contenção nova.
      Independentemente da correção, o **comentário precisa deixar de mentir** — e o mesmo vale
      para `NovaExecucao.tsx:176`, que fica com DEB-12.3-C.
  - id: OBS-123-3
    severity: low
    category: code
    status: verificado-sem-acao
    titulo: "`boletos.status` tem CINCO valores: `processando` não conta como 'já emitido' e ninguém discutiu isso"
    description: >
      Achado desta revisão. A story, o commit, os comentários e os testes discutem quatro estados
      (`emitido`, `pago`, `cancelado`, `falha`). O CHECK real é
      `check (status in ('processando','emitido','falha','pago','cancelado'))`
      (`0037_idempotencia_boletos.sql:46-47`). `processando` é a **reserva** gravada ANTES da
      chamada ao gateway (padrão "reserva antes de chamar", `boleto-repository.ts:20-34`).
      Como o filtro é `in ('emitido','pago')`, um cliente cujo boleto está `processando` **não**
      aparece como já emitido. Nas condições normais isso dura segundos. O caso que interessa é o
      que a própria migration 0037 declara em aberto: *"Não inclui 'reaper' automático de linhas
      'processando' travadas (function morta entre o INSERT e o UPDATE) — considerado follow-up"*.
      Uma reserva órfã fica `processando` indefinidamente; o cliente segue elegível ao lote; e o
      índice único não protege, porque a segunda rodada cria um `execucao_resultado_id` novo.
      Note o contraste que reforça o ponto: o índice único da 0037 usa
      `where status in ('processando','emitido','pago')` — os **três**. As duas consultas de guarda
      (médicos e clientes contábeis) usam só dois. A divergência pode até ser deliberada (uma
      reserva não confirmada não é uma cobrança), mas não está escrita em lugar nenhum.
      **Não bloqueia e não é desvio:** a AC 2 prescreve literalmente `status in ('emitido','pago')`
      e o espelho de médicos faz o mesmo. Registro para que o par `(emitido, pago)` seja uma
      escolha consciente e não uma cópia que sobreviveu à ampliação do CHECK.
    recommendation: >
      Sem ação nesta story e sem reabrir. Quando **DEB-12.3-A** (guarda de servidor) for
      especificada, decidir explicitamente se `processando` conta como ocupado — se a guarda virar
      constraint, o alinhamento natural é com o índice da 0037 (os três estados). Se o "reaper" de
      `processando` travado sair do follow-up algum dia, esta observação deixa de importar.
  - id: OBS-123-4
    severity: low
    category: code
    status: debito-registrado
    titulo: "Falha fechada sem caminho de recuperação, e o passo de faturamento não respeita o estado da guarda"
    description: >
      Dois sintomas da mesma raiz, ambos achados desta revisão:
      **(a) Sem retry, e com rótulo que mente depois da falha.** Decidido falhar fechado (D-1,
      aceita), o ramo de erro é um `<p className="alert-error">` estático (`:219-224`) sem botão
      "Tentar novamente". Pior: o botão de calcular continua renderizado e desabilitado exibindo
      **"Verificando emissões…"** (`:173-174`), porque o ternário só distingue `isPending` de
      `guardaPronta` e não tem ramo para `isError` — depois das 3 tentativas do React Query nada
      mais está sendo verificado, e o rótulo diz que sim. Como `retry` não é sobrescrito e
      `refetchOnWindowFocus` é `false` (OBS-123-2), não há revalidação passiva nenhuma: a única
      recuperação é fechar e reabrir o modal. Fechar duro **e** não oferecer saída transforma uma
      indisponibilidade de segundos numa interrupção que o operador precisa adivinhar como
      resolver. O `<p>` também não tem `role="alert"`, então quem usa leitor de tela não é avisado
      de que o fluxo travou.
      **(b) Faturamento fora do gate.** O botão "Lançar faturamentos e continuar" (`:258-265`) tem
      `disabled={lancarFaturamentos.isPending}` apenas — sem `|| !guardaPronta`. Durante o
      carregamento e no erro, `elegiveis === clientes`, então o passo 1 opera sobre a lista inteira,
      incluindo quem D-2 diz que deveria estar fora. Impacto baixo (registro de receita, não
      cobrança; `unique (cliente_contabilidade_id, competencia)` da 0031 limita o estrago; e o lote
      não avança de qualquer forma), mas é uma inconsistência entre D-1 e D-2 dentro do mesmo
      componente.
    recommendation: >
      **(a) → 12.6**, que é a dona declarada de "erro vs. vazio nos pontos de carga" neste arquivo.
      **Atenção ao roteamento:** a AC 1 da 12.6 enumera **4 pontos** e o novo `comBoletoQ` **não
      está entre eles** (ela cita `LoteContabilidadeDialog.tsx:73-79`, que é a query de
      `resultados`). Enumeração fechada não absorve item novo por herança — o @po precisa
      **acrescentar explicitamente** o ponto da guarda à AC 1 e à File List da 12.6, senão o item
      morre no Dev Agent Record. O `role="alert"` cabe na 12.12 (dona dos anúncios assistivos neste
      arquivo), pelo mesmo caminho de acréscimo explícito.
      **(b) → 12.4** (próxima da fila `RS-9`, dona do passo de faturamento em massa): acrescentar
      `|| !guardaPronta` ao `disabled` do botão. Uma condição. Registrado como parte de DEB-12.3-B
      para viajar junto com a correção de `staleTime` no mesmo arquivo.
  - id: OBS-123-5
    severity: info
    category: tests
    status: verificado-sem-acao
    titulo: "A rota nova é mais bem testada que o espelho que ela copia (6 testes vs. 4)"
    description: >
      Registro positivo, com uma ressalva de honestidade. `com-boleto-route.test.ts` tem 6 testes
      contra os 4 de `medicos-com-boleto-route.test.ts`: os dois extras são "cada competência é
      consultada isoladamente" e — o mais valioso — `expect(dynamic).toBe('force-dynamic')`, que
      trava a AC 1 como **contrato de código**, não como intenção de comentário. É exatamente o
      tipo de asserção que impede alguém de "otimizar" a rota com cache seis meses depois. Bom
      trabalho, e o espelho ficou pior que a cópia.
      **Ressalva:** a seção Testing da story pede "rota (sem cache, **401/403 por papel**)" e isso
      **não** foi entregue como asserção de status — o teste afirma
      `expect(mockRequireRole).toHaveBeenCalledWith([...])`, ou seja, verifica que a rota **pede** o
      papel certo, não que uma sessão sem papel receba 401/403. Aceito: `requireRole` está mockado,
      o comportamento de 401/403 é do `require-role` (testado no próprio módulo) e o espelho de
      médicos faz exatamente igual. Verificar a chamada é a asserção correta neste nível de
      isolamento; só não é o que a seção Testing literalmente descreve.
    recommendation: "Nenhuma ação. Se algum dia o `medicos-com-boleto` for tocado, copiar de volta a asserção de `force-dynamic`."
  - id: OBS-123-6
    severity: info
    category: requirements
    status: verificado-sem-acao
    titulo: "\"25 rotas\" não é reproduzível — e o \"24 rotas\" do meu próprio gate da 12.2 também não era"
    description: >
      O Dev Agent Record e a mensagem de commit dizem "`npm run build` OK (25 rotas)". O build está
      **verde de fato** (exit 0, `✓ Compiled successfully`) e a rota nova aparece corretamente como
      `ƒ /api/clientes-contabilidade/com-boleto`, mas o número 25 não corresponde a nenhuma
      contagem que eu consiga extrair da saída: a tabela `Route (app)` lista **100** rotas (77 de
      API + 23 de página, incluindo `/_not-found` e `/manifest.webmanifest`), o Next reporta
      **59/59** páginas estáticas geradas, e há **21** `page.tsx` versionados.
      Registro com autocrítica: o gate da 12.2 que eu mesma assinei diz "`npm run build` (exit 0,
      **24 rotas**) — batem exatamente com o reportado". 24 → 25 é um delta de +1 coerente com uma
      rota nova, o que sugere que os dois números vêm da mesma métrica não documentada (e que eu
      aceitei o número em vez de reproduzi-lo). Fiz a verificação que substitui a contagem e que
      **é** reproduzível: arquivos de rota em `apps/web/src/app` passaram de **76** (`457cbf3~1`)
      para **77** (`457cbf3`) — exatamente +1, nenhuma removida — e `page.tsx` continua em 21 nos
      dois commits.
    recommendation: >
      Sem ação de código e sem reabrir. Para os próximos gates do Épico 12 (meu e de quem me
      suceder): parar de citar "N rotas" e usar a asserção verificável — "+1 rota de API,
      `ƒ /api/...` no build, 0 páginas removidas". Se o @po consolidar métricas do épico, não usar
      nem 24 nem 25.

