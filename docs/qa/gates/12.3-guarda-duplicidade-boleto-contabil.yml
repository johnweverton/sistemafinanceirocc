debitos_tecnicos_do_epico:
  - id: DEB-12.3-A
    severity: medium
    category: architecture
    titulo: "Guarda de servidor por `(cliente_contabilidade_id, competência)` — o resíduo de `RS-1`"
    origem: "Nota de escopo do @po ([AJUSTE @po 2026-08-25]) + OBS-123-1 e OBS-123-2 desta revisão"
    dono_hoje: "NENHUM — depende de decisão do dono, conforme o @po. Não existe story aberta."
    avaliacao: >
      O @po já declarou que fechar o resíduo é **story nova**. Este gate acrescenta o escopo que
      essa story precisa cobrir, porque o resíduo é maior do que a nota original descreve — são
      **três** camadas, não uma:
      (1) corrida entre abas/operadores na janela consulta → `POST .../lote` (documentada; mitigada
          só parcialmente pelo rate limiter de 3/min por usuário);
      (2) janela de dado obsoleto do cache de cliente, sem teto definido (OBS-123-2);
      (3) sequência calcular → calcular → emitir os dois, que não passa por boleto nenhum entre as
          rodadas (OBS-123-1).
      Uma guarda de servidor por `(cliente, competência)` sobre boletos ativos fecha (1) e (2) de
      uma vez; (3) exige ou a mesma guarda no momento da emissão, ou uma checagem no
      `iniciarLoteClientesContabilidade`. Ao especificar, decidir também o tratamento de
      `processando` (OBS-123-3) e se a guarda vale igualmente para o fluxo **médico**, que tem o
      mesmo desenho e o mesmo resíduo.
    recomendacao: >
      @po/dono: abrir a story nova com escopo explícito das 3 camadas + `processando` + paridade
      médico/contábil. **Não** implementar dentro da 12.3, 12.4, 12.5, 12.6 ou 12.8 por iniciativa
      própria — constraint em tabela de produção não é subtarefa de story de UX.
      Até lá, `RS-1` permanece **REDUZIDO, NÃO FECHADO** no registro de risco do épico.
