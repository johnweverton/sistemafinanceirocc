logica_central_de_exclusao:
  veredito: CORRETA — e com um terceiro estado que ninguém tinha olhado
  analise: >
    Confirmado no código (`boleto-repository.ts:271`): `.in('status', ['emitido', 'pago'])`. Logo
    `emitido` e `pago` contam como "já emitido"; `cancelado` e `falha` **não** contam, então
    cancelar e reemitir corrigido continua funcionando sem exceção manual — que é exatamente o que
    sustenta o Cenário A sem opt-in. O teste não se contenta com a igualdade: além de
    `expect(builder.in).toHaveBeenCalledWith('status', ['emitido','pago'])`, ele afirma
    separadamente `not.toContain('cancelado')` e `not.toContain('falha')`, o que é a asserção certa
    — trava a **ausência**, que é a parte que uma refatoração distraída quebraria.
    Coerência com o resto do sistema conferida em vez de assumida: a migration 0037 documenta o
    mesmo espírito no índice único (`'cancelado'/'falha' NÃO entram: reemitir sobre eles é
    legítimo`), e `buscarBoletoEmitido` usa o mesmo par. A regra é consistente ponta a ponta.
    **Terceiro estado (achado desta revisão):** o CHECK real de `boletos.status` (migration 0037)
    é `('processando','emitido','falha','pago','cancelado')` — são **cinco**, não quatro. A story,
    o commit e todos os comentários só discutem quatro. Ver OBS-123-3.
tratamento_do_id_nulo:
  veredito: CORRETO — sem id fantasma e sem falso positivo
  analise: >
    A constraint `chk_execucao_resultados_exclusao_mutua` (migration
    `0032_execucao_cliente_contabilidade.sql:28-32`) garante exclusão mútua entre `medico_id`,
    `empresa_id` e `cliente_contabilidade_id`, e permite os três nulos. Logo todo resultado de
    médico ou de empresa tem `cliente_contabilidade_id = null`.
    Duas defesas no código, ambas necessárias e ambas presentes: (1) o `!inner` no `select` já
    restringe às linhas com join, mas **não** filtra a coluna nula — sem a segunda defesa,
    `ids.add(null)` colocaria `null` no `Set`; (2) `if (clienteId) ids.add(clienteId)`
    (`:286`) descarta `null`, `undefined` e `''`. O `row.execucao_resultados?.` ainda protege o
    caso de o join vir ausente.
    Falso positivo é **impossível por construção**, e é importante entender por quê: o consumidor
    faz `clientesComBoletoAtivo.has(c.id)` com `c.id` sendo um UUID de `clientes_contabilidade`.
    Mesmo que um `null` entrasse no `Set`, nenhum `c.id` seria `null` — não haveria como um cliente
    contábil real casar com o id fantasma. O risco real que o `if` evita é de higiene do dado
    (`Set` com `null`, `size` inflado, e qualquer futuro consumidor que itere o `Set` em vez de
    consultá-lo). O @dev tratou como se o risco fosse maior do que é, o que neste contexto é o erro
    certo a cometer.
    Coberto por teste dedicado ("ignora resultados sem cliente_contabilidade_id (boleto de
    médico/empresa)") com uma linha `null` e uma linha válida no mesmo `data` — o teste falharia
    tanto se o `null` entrasse quanto se o `if` descartasse a linha boa junto.
regressao_12_1:
  veredito: "Correção legítima de mock — NENHUMA asserção da 12.1 foi relaxada. Verificado empiricamente, não por leitura."
  o_que_eu_fiz: >
    Não me contentei com o diff. Extraí o arquivo `tests/components/LoteEmissaoDialog.test.tsx` do
    commit **anterior** (`457cbf3~1`) para um caminho temporário e rodei contra o `src` atual:
    **4 testes falharam**, exatamente os 4 do bloco "LoteEmissaoDialog aberto pelo lote contábil
    (AC 5 + AC 6)", todos com
    `[vitest] No "clienteContabilidadeQueryKeys" export is defined on the
    "../../src/services/clientes-contabilidade" mock`. Arquivo temporário removido em seguida;
    `git status` da árvore de testes limpo. Ou seja: a quebra relatada é **real, reproduzível e
    de superfície de mock** — o componente passou a importar `clienteContabilidadeQueryKeys` no
    topo e a chamá-lo no primeiro render, e um `vi.mock` de fábrica só expõe o que devolve.
  prova_de_que_nada_foi_afrouxado:
    - "Linhas REMOVIDAS pelo commit no arquivo: exatamente 3, todas idênticas — `fireEvent.click(screen.getByRole('button', { name: /Calcular 1 em lote/ }));`. Nenhuma outra linha foi apagada."
    - "Contagem de `expect(`: **17 antes, 17 depois**."
    - "`diff` do conjunto de linhas `describe(` / `it(` / `expect(` entre `457cbf3~1` e `457cbf3`: **vazio**. Nenhum nome de teste, nenhuma asserção e nenhum valor esperado mudou — nem um caractere."
    - "A troca `getByRole` → `await findByRole` é **mais rígida**, não menos: `getBy` falharia instantaneamente e `findBy` espera o botão assumir o rótulo `Calcular 1 em lote`, ou seja, o teste agora exige que a guarda **resolva com sucesso** antes do clique. Se a guarda travasse em `Verificando emissões…`, o `findBy` estouraria por timeout — o teste continuaria detectando a quebra."
    - "O mock novo devolve lista **vazia** (`{ clienteContabilidadeIds: [] }`), que é o estado neutro: nenhum cliente é excluído, então os 4 testes exercitam exatamente o mesmo fluxo de modal de antes."
  execucao_propria: >
    `npx vitest run tests/components/LoteEmissaoDialog.test.tsx
    tests/components/LoteContabilidadeDialog.test.tsx
    tests/server/clientes-contabilidade/com-boleto-route.test.ts
    tests/server/repositories/boleto-repository-clientes-contabilidade-com-boleto.test.ts`
    → **4 arquivos / 29 testes, todos verdes** (7 + 10 + 6 + 6).

