impacto_no_sequenciamento: >
  **CONCERNS não segura a fila.** A "Nota de sequenciamento (RS-9)" exige que 12.4 só abra depois
  de 12.3 "fechar o gate de @qa" — este gate está fechado, com decisão registrada e sem rework
  pendente para o @dev. **12.4 está liberada para abrir.** Ordem obrigatória mantida:
  **12.3 → 12.4 → 12.5 → 12.6**, com 12.8 na mesma contenção, e a fila estendida do arquivo
  (12.12 / 12.15 / 12.16 / 12.17) inalterada.
  Avisos para quem abrir a 12.4:
  · o arquivo cresceu ~92 linhas líquidas — ver DEB-12.3-D antes de confiar nos números de linha;
  · dois itens de DEB-12.3-B são de duas linhas e cabem naturalmente no diff da 12.4, **se o @po
    acrescentá-los** (enumeração de AC fechada não absorve item novo por herança — foi assim que a
    12.2 quase perdeu um débito);
  · **critério de reprovação a partir daqui:** qualquer reintrodução de opt-in, checkbox de
    reinclusão, "emitir mesmo assim" ou qualquer caminho que devolva ao payload um cliente marcado
    como já emitido é **violação direta do Cenário A** e da AC 4 desta story — o dono fechou a
    decisão e a mudança seria story nova, não ajuste de implementação. Os testes de ausência já
    existem para pegar isso; não removê-los.
  Pendências que **não** bloqueiam a fila mas precisam de decisão do @po antes do fechamento do
  épico: DEB-12.3-A (sem dono, e é o que impede declarar `RS-1` fechado), DEB-12.3-C (sem dono) e
  o acréscimo explícito de OBS-123-4a à AC 1 / File List da **12.6**.
