issues:
  - id: QA-104A-1
    severity: medium
    category: code
    description: >
      Migration 0028 usava `alter table empresas add constraint ...` para as 4 CHECKs
      (pagador_tipo, conta_emissora, regra_preco_forma, regra_preco_coerente) sem o
      `drop constraint if exists` prévio que todas as migrations anteriores do projeto
      usam (0018, 0025, 0027) para permitir re-execução segura. Como a `create table`
      já é `if not exists` (no-op numa segunda aplicação), uma reaplicação acidental da
      migration falharia nas 4 linhas de `add constraint` com "constraint already
      exists", quebrando o padrão de idempotência documentado no próprio arquivo.
    recommendation: >
      CORRIGIDA na iteração 1 — adicionado `alter table empresas drop constraint if
      exists <nome>;` antes de cada uma das 4 `add constraint`, replicando exatamente o
      padrão de 0025/0027.
