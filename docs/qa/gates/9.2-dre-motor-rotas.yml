  indisponível na máquina — cobertura manual reforçada com build de produção.
issues:
  - id: QA-921-1
    severity: medium
    category: code
    description: >
      PATCH /api/plano-contas/[id] e /api/plano-contas/regras/[id] aceitavam corpo vazio
      `{}` (todos os campos são opcionais no schema) — a rota cairia no ramo
      `atualizarCategoria`/`atualizarRegra` com `{nome: undefined, ordem: undefined}` (ou
      equivalente), que o Supabase serializa como um PATCH sem colunas a atualizar. Efeito
      provável: erro pouco claro do PostgREST (ou 500 genérico) em vez de um 422 direto —
      só se manifestaria com uma chamada HTTP malformada (cliente da 9.3 ou teste manual),
      não achado por typecheck/lint/vitest (o mock de repository não reproduz o
      comportamento real do PostgREST).
    recommendation: >
      CORRIGIDA na iteração 1 — `.refine()` nos dois schemas exigindo ao menos um campo
      preenchido; corpo vazio agora rejeita com 422 claro ANTES de chegar no repository.
      Testes dedicados adicionados nos dois arquivos de rota.
  - id: OBS-922
    severity: low
    category: requirements
    description: >
      `GET /api/dre/relatorio` não valida `inicio <= fim`. Um período invertido não
      quebra (o engine devolve um relatório zerado, já que nenhuma transação/lançamento
      cai num intervalo vazio/invertido) — apenas confunde quem chamou a rota errado.
    recommendation: Considerar validação explícita (400) na 9.3 se a UI permitir esse erro de digitação.
  - id: OBS-923
    severity: low
    category: performance
    description: >
      Herdada do gate 9.1 (OBS-912): sem índice em `categoria_id` nas tabelas do DRE.
      Irrelevante no volume atual (dezenas de categorias/lançamentos, centenas de
      transações/mês) — mesma decisão de deferir já tomada.
    recommendation: Revisar se o volume crescer significativamente.
