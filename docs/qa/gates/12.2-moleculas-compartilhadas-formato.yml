      `lib/adicional-semestral.ts` e `app/api/clientes-contabilidade/route.ts` — nenhum
      `RecebiveisManager`. São duas telas "Manager" diferentes (`/clientes-contabilidade` vs.
      `/recebiveis`) e o @dev trocou uma pela outra.
      Pior: `grep -l RecebiveisManager docs/stories/12.*.story.md` devolve **apenas 12.1 (já
      fechada) e a própria 12.2**. Nenhuma story aberta do Épico 12 é dona desse arquivo — do jeito
      que está, o débito **não tem para onde ir** e morre no Dev Agent Record.
      Insumo extra de decisão, que reforça o valor da migração e que ninguém registrou: como o campo
      é texto livre e a `queryKey` muda a cada tecla, toda competência parcial ("2", "20", "202")
