    severity: info
    category: requirements
    status: verificado-sem-acao
    titulo: "A contagem de duplicações é 27, não 26 (erro de aritmética que vai virar métrica do épico)"
    description: >
      Recontei no commit anterior em vez de aceitar o número: `79e4acf~1` tinha **18** cópias de
      `brl` (17 `function` + 1 arrow em `email-gateway.ts:124`), **6** de `normalizarBusca` e **3**
      de `competenciaAtual`. 18 + 6 + 3 = **27**. A story ([D-1], Completion Notes), o Change Log e
      a mensagem do commit `79e4acf` dizem "26". A implementação está **certa** — todas as 27 foram
      eliminadas e restaram 3 definições canônicas; o erro é só no texto. Registro porque a story e
      a mensagem de commit são o registro durável, e a métrica "N duplicações → 4 utilitários" tende
      a ser citada de volta no fechamento do Épico 12.
    recommendation: >
      Sem ação de código e sem reabrir a story. Se o @po/@sm consolidar métricas do épico, usar
