notes: >
  AC 1-7 verificados contra o diff real de `79e4acf`, não contra o relato do @dev. Comandos
  reexecutados por mim nesta revisão, dentro de `apps/web`: `npx tsc --noEmit` (exit 0),
  `npm run lint` ("No ESLint warnings or errors"), `npx vitest run` (**130 arquivos / 1164 testes,
  130 passed / 1164 passed**) e `npm run build` (exit 0, 24 rotas) — batem **exatamente** com o
  reportado no Dev Agent Record. Árvore conferida antes de rodar: `HEAD` é `79e4acf` e
  `git status --short` não tem nenhum arquivo de `apps/web` sujo, então a suíte reflete o commit
  revisado e não estado de trabalho local. `RS-8` (rebase) confirmado pela topologia real:
  `79e4acf → daaa36d → 7803dc0`, sem merge nem conflito com a 12.1.
  AC 1: `lib/formato.ts` entrega `brl()` (`toLocaleString('pt-BR', currency BRL`) e
  `normalizarBusca()` (NFD + remoção de U+0300–U+036F + `toLowerCase`), ambos funções puras, com
  JSDoc que documenta o espaço não quebrável do `toLocaleString` — detalhe que salva quem escrever
  o próximo teste.
  AC 2: `competenciaAtual()` entrou **em `lib/competencia.ts`**, ao lado de `competenciaAnterior`,
  como a nota de reuso "grounded" do épico exigia — não em arquivo novo.
  AC 3: os 6 pontos editáveis conferidos um a um no diff — `NovaExecucao.tsx` (3 modos, incluindo o
  que precisava preservar `name="competencia"`, e o @dev preservou), `LoteContabilidadeDialog`,
  `GerarExecucao`, `FaturamentoEEmissao`. `HistoricoExecucoes.tsx:167` intocado, como o @po fixou.
  AC 4: **verificado por conta própria, não pelo grep do @dev.** Contei as duplicações no commit
  ANTERIOR: `git grep -c -E "function brl\(|const brl = \(" 79e4acf~1 -- 'apps/web/src/**'` = **18**,
  `function normalizarBusca\(` = **6**, `function competenciaAtual\(` = **3**. Hoje
  `rg 'function (brl|normalizarBusca|competenciaAtual)' apps/web/src` devolve **só as 3 definições
  em `lib/`** — mais `brlCompacto` em 3 arquivos de gráfico, que é outra função (rótulo compacto de
  eixo) e está corretamente intocada.
  AC 5: os 5 pontos enumerados migrados + 1 **toast** que a AC não listava e que imprimia
  "R$ 250.00" na tela (`FaturamentoEEmissao.tsx:63`) — achado do @dev, correto e valioso. O
  `toFixed` que sobrou em `apps/web/src` é: `SyncModal.tsx:152` (percentual, não moeda),
  `server/engine/**` (port 1:1 do Python, fora de escopo por decisão do épico) e
  `server/emissao/emitir-boleto.ts:128` — ver OBS-122-1.
  AC 6: os 3 `<input>` de texto de `NovaExecucao` viraram `type="month"`; o valor inválido não
  chega mais ao estado. Os testes pré-existentes de `NovaExecucao.test.tsx` e
  `FaturamentoEEmissao.test.tsx` continuam usando `getByLabelText('Competência')` **sem alteração**
  e passam — sinal forte de que a associação rótulo↔campo sobreviveu à migração (smoke real dos
  consumidores, ainda que o @dev não tenha escrito testes novos para eles).
  D4 (restrição do épico): `git show 79e4acf --name-only` não devolve nenhum `.css`, nenhum
  `docs/design-system.md` e nenhum `server/engine/**`; o único doc tocado é a própria story.
  Anti-self-review: revisão ativa. Recontei as duplicações no commit anterior em vez de aceitar o
  número do @dev (e achei 27, não 26 — OBS-122-3), rastreei o campo de `RecebiveisManager` até o
  `.eq()` do repositório para julgar "filtro vs. dado", conferi a File List da 12.18 real em vez do
  relato (o roteamento sugerido pelo @dev está errado — OBS-122-2) e encontrei um `toFixed` de
  moeda que chega à tela e que o @dev não registrou (OBS-122-1).
decisoes_do_dev_avaliadas:
  - id: D-1
    assunto: "Escopo da AC 4 ampliado — 11 duplicações mapeadas vs. 27 reais em `apps/web/src`"
    veredito: ACEITA
    justificativa: >
      A leitura literal do @dev é a correta, e **não** por generosidade de interpretação: a mesma
      cláusula universal aparece no **critério de pronto do próprio épico** para a 12.2
      (`epic-sanitizacao-emissoes.md`, §Fase 0): *"nenhuma cópia local de
      `brl`/`competenciaAtual`/`normalizarBusca` no `apps/web/src`"*. Ou seja, o quantificador
      universal e o escopo `apps/web/src` não são invenção da story — são texto do épico, repetido
      na AC 4. O parêntese "(11 duplicações → 4 utilitários)" é herdado da auditoria
      (`ux-gaps-emissoes.md`, R-12: "as 4+3+4 duplicações"), que se declara limitada ao **caminho de
      emissão**. Uma **contagem estimada** não pode estreitar uma **cláusula normativa
      universalmente quantificada** — se pudesse, a AC 4 ficaria literalmente descumprida no dia da
      entrega, com 15+ cópias vivas ao lado do utilitário novo.
      Verifiquei também a premissa (b) do @dev em vez de aceitá-la: extraí todas as linhas `+`/`-`
      dos 21 arquivos de consumidor e **todos os corpos removidos são byte-a-byte idênticos** ao
      canônico (`v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })`, ou a variante
      `(v ?? 0)`; e `normalizarBusca` com o mesmo NFD + classe de combining marks). Cada arquivo
      "extra" é literalmente `apaga a função, adiciona o import`. Delta de comportamento: zero.
      **Não é scope creep e não é regressão** — é a AC executada como escrita. Registrado para o
      @po: o diff (33 arquivos de código) é maior que a File List proposta (~10), e isso é
      consequência prevista da cláusula, não desvio.
  - id: D-2
    assunto: "`brl` aceita `number | null | undefined`, não só `number` (letra da AC 1)"
    veredito: ACEITA
    justificativa: >
      Alargar um parâmetro é seguro por contravariância — todo chamador que passava `number`
      continua compilando e produzindo exatamente o formato que a AC 1 descreve (`brl(1480.56)` →
      "R$ 1.480,56", travado por teste). Confirmei no `79e4acf~1` que **4 das 18 cópias** já tinham
      a assinatura nulável com `(v ?? 0)` embutido (`HistoricoExecucoes:11`,
      `HistoricoExecucoesPorMedico:12`, `ExtratoManager:24`, `RecebiveisManager:15`): unificar na
      assinatura estrita obrigaria a espalhar `?? 0` pelo JSX dessas 4 telas, mudança cosmética com
      risco de esquecer um ponto. A implementação é superconjunto da pedida, com teste dedicado para
      `null`/`undefined`.
  - id: D-3
    assunto: "`competenciaAtual()` lê o relógio LOCAL; `competenciaAnterior()` continua em UTC"
    veredito: ACEITA
    justificativa: >
      **Intencional, documentado e testado — não é bug introduzido.** Três verificações
      independentes: (1) as 3 cópias eliminadas usavam `getFullYear()/getMonth()` (locais) no
      `79e4acf~1` — é port 1:1, o @dev não introduziu leitura nova nem "consertou" nada de
      passagem; (2) o JSDoc de `competenciaAtual` explica o porquê e termina com o aviso operacional
      certo ("as duas leituras são deliberadas; não unificar sem revisar os dois chamadores"), e o
      cabeçalho do arquivo foi atualizado para dizer que cada função documenta qual relógio lê —
      quem abrir o arquivo daqui a seis meses não vai "corrigir" a assimetria por engano;
      (3) existe teste dedicado (`competencia.test.ts`, "segue o calendário LOCAL do operador, não o
      UTC") com o caso 31/08 21h em UTC-3, que quebraria se alguém trocasse por `getUTCMonth()`.
      O raciocínio de fundo confere: `competenciaAtual` só pré-preenche campo em componente
      `'use client'` (os 3 consumidores são client components, conferido), e em UTC-3 o dia 31 às
      21h já é o mês seguinte em UTC — o campo abriria errado exatamente na virada do mês, que é
      quando o fechamento acontece. `competenciaAnterior` roda no cron, em servidor UTC.
      A assimetria é a resposta certa; unificar seria o bug.
  - id: D-4
    assunto: "Removido o apoio 'Formato: AAAA-MM (Ex: 2026-05)', `placeholder`, `maxLength` e `font-mono`"
    veredito: ACEITA
    justificativa: >
      Sob `<input type="month">` o navegador renderiza um seletor mm/aaaa; instruir "digite AAAA-MM"
      passaria a ser instrução errada, e `maxLength`/`placeholder` não têm efeito em `type="month"`.
      O teste `CampoCompetencia.test.tsx` inclusive **trava a ausência** desses atributos, o que
      impede a volta silenciosa do padrão antigo. Nenhum teste dependia dos textos removidos
      (conferido: os testes de `NovaExecucao` sempre selecionaram o campo por `getByLabelText`).
  - id: D-5
    assunto: "Guardas de regex de disparo mantidas onde estavam"
    veredito: ACEITA
    justificativa: >
      Conferido no código: `NovaExecucao` (`competenciaValida`, `:346`, além de `:180` e `:232`)
      mantém `/^\d{4}-\d{2}$/`; `GerarExecucao.tsx:69` e `FaturamentoEEmissao.tsx:86` mantêm
      `/^\d{4}-(0[1-9]|1[0-2])$/`. Continuam necessárias para o caso "campo vazio" (`type="month"`
      entrega `''` quando o operador limpa) e deixaram de ser a única barreira contra mês
      inexistente. Ver OBS-122-4 para a nota de defesa em profundidade no servidor.
  - id: ACHADO-FORA-DE-ESCOPO
    assunto: "7º campo de competência em `RecebiveisManager.tsx:191` não migrado"
    veredito: ACEITA COM RESSALVA (a exclusão está certa; a justificativa e o roteamento estão errados)
    justificativa: >
      **A exclusão é correta e confirmada.** Rastreei o campo ponta a ponta em vez de aceitar o
      rótulo "filtro": `useState('')` (`:118`) → `filtros.competencia = competencia || undefined`
      (`:144`) → `queryKey`/`recebiveisService.listar` (`:149-152`) → `GET /api/recebiveis` →
      `recebiveis-repository.ts:26`, que faz apenas `query.eq('competencia', filtros.competencia)`.
      **Em nenhum ponto o valor é persistido nem vira competência de faturamento** — é filtro de
      leitura puro. Não deveria ter entrado no escopo da 12.2: ACs 3 e 6 enumeram 6 pontos, e o
      `[AJUSTE @po 2026-08-25]` fechou essa lista deliberadamente.
      **Ressalva 1 — a analogia do @dev não se sustenta.** O @dev justificou dizendo que "o mesmo
      raciocínio que tirou o `<select>` de `HistoricoExecucoes.tsx:167` se aplica". Não se aplica:
      o de `HistoricoExecucoes` é um `<select>` de competências **já existentes**, e trocá-lo por um
      seletor de mês livre **mudaria comportamento** — esse é o motivo real da exclusão dele. O de
      `RecebiveisManager` é um `<input>` de **texto livre** cujo contrato de valor é idêntico ao do
      `<CampoCompetencia>` (`AAAA-MM` ou `''`): migrá-lo **não** mudaria comportamento nenhum. A
      exclusão se sustenta só pela enumeração fechada das ACs, não pelo paralelo com
      `HistoricoExecucoes`. Corrigir o registro importa para que a próxima story não herde um
      raciocínio inválido.
      **Ressalva 2 — o roteamento sugerido é factualmente errado:** ver OBS-122-2.
issues:
  - id: OBS-122-1
    severity: low
    category: code
    status: debito-registrado
    titulo: "`toFixed(2)` de moeda sobrevivente que CHEGA à tela: `server/emissao/emitir-boleto.ts:128`"
    description: >
      Achado desta revisão, não registrado pelo @dev. O @dev fechou a AC 5 com
      `grep toFixed apps/web/src/components apps/web/src/app` — escopo que **exclui `server/`**.
      Rodei o grep em `apps/web/src` inteiro e sobrou um caso de moeda fora do `server/engine`:
      `validarResultadoParaEmissao` monta
      `` `Valor do resultado (R$ ${Number(resultado.total_valor).toFixed(2)}) está abaixo do mínimo
      aceito pelo gateway (R$ 5,00).` `` e lança como `ApiError` 422 `VALOR_ABAIXO_MINIMO`.
      Confirmei que essa string **é renderizada**: `GerarExecucao.tsx:127` e
      `RelatorioGrupos.tsx:135` fazem `toast(e.message, 'error')` cru na emissão individual. Ou
      seja, numa emissão abaixo do mínimo a tela mostra literalmente
      "Valor do resultado (R$ 4.50) está abaixo do mínimo aceito pelo gateway (R$ 5,00)" — os dois
      formatos, errado e certo, na **mesma frase**. É exatamente o defeito que a AC 5 nomeia.
      Não reprova o gate: a AC 5 enumera os 5 pontos de G-27 (todos em componentes) e todos foram
      migrados, e a auditoria nunca varreu `server/`. Mas há uma **assimetria de escopo do @dev**
      digna de registro: para a AC 4 ele varreu `server/` (e corrigiu `gateway/email-gateway.ts`);
      para a AC 5, não. O caminho de lote está protegido — `LoteEmissaoDialog.tsx:13` traduz
      `VALOR_ABAIXO_MINIMO` para mensagem própria já em pt-BR —, então o vazamento é só na emissão
      individual.
    recommendation: >
      Uma linha: importar `brl` de `@/lib/formato` em `server/emissao/emitir-boleto.ts` e trocar
      `R$ ${Number(...).toFixed(2)}` por `${brl(Number(resultado.total_valor))}`. **Absorver na
      12.13**, que já é a story do "texto do mínimo do gateway" (AC 3, e cita `VALOR_ABAIXO_MINIMO`
      nas Dev Notes) — exige acrescentar `apps/web/src/server/emissao/emitir-boleto.ts` à File List
      dela. **Não abrir story própria** e **não reabrir a 12.2**.
  - id: OBS-122-2
    severity: low
    category: requirements
    status: debito-registrado
    titulo: "O débito do campo de `RecebiveisManager` foi roteado para uma story que não abre esse arquivo"
    description: >
      Achado desta revisão. O @dev encerrou o achado fora de escopo com *"sugiro decidir junto com
      12.18 (avisos de carteira/lista), que já mexe nessa tela"*. **12.18 não mexe nessa tela.**
      Conferido na fonte, não no relato: a File List de
      `docs/stories/12.18.avisos-carteira-lista.story.md` (`:50-51`) e o épico (§12.18) listam
