qualidade_dos_testes:
  veredito: "Corrigidos para o formato certo, não re-skinados para passar"
  analise: >
    Os dois testes que o @dev diz que "já documentavam o bug" foram conferidos linha a linha:
    · `DetalheCliente.test.tsx` — era `getByText('R$ 250.00')` (igualdade exata com o formato
      ERRADO); virou `getByText((t) => t.replace(/\s/g, ' ') === 'R$ 250,00')`, que continua sendo
      **igualdade de string inteira**, só tolerando o espaço não quebrável do `toLocaleString`.
      Rigor preservado, valor esperado corrigido — não foi afrouxado para regex nem substring.
    · `GerarExecucao.test.tsx:114` — era `getByText(/R\$ 1200.00/)`, uma **regex de substring**;
      virou igualdade de string inteira com `'Valor calculado: R$ 1.200,00'`. Ou seja, o teste ficou
      **mais rígido** do que era: agora trava também o separador de milhar e o rótulo em volta.
    · `formato.test.ts` fecha o argumento de forma independente das telas: afirma
      `brl(1480.56) === 'R$ 1.480,56'` e, na linha seguinte, afirma explicitamente que
      `` `R$ ${(1480.56).toFixed(2)}` === 'R$ 1480.56' ``. O bug fica **documentado** no teste, não
      apagado — quem ler entende o que mudou e por quê.
    · Cobertura nova: 13 testes em `formato.test.ts` (milhar, milhão, zero, negativo, arredondamento
      de meio centavo, nulável, 6 famílias de diacríticos, ausência deliberada de `trim`),
      5 em `competenciaAtual` (zero à esquerda, virada de dezembro, mês 0 → "01", `vi.setSystemTime`,
      fuso local) e 9 em `CampoCompetencia` (inclui travar a **ausência** de `maxLength`/`placeholder`
      e a não colisão de `id` entre os 3 campos de `NovaExecucao`). Total 27 novos — o @dev reportou
      22, subcontagem inofensiva.
    · Ressalva honesta, já registrada pelo próprio @dev no cabeçalho do teste: o jsdom não implementa
      a máscara do controle nativo `month`, então "2026-13 é impossível" é garantido pelo navegador,
      não provado pela suíte. O teste observa o que dá para observar (o atributo `type="month"` e a
      sanitização de `value` do jsdom) e **diz isso em voz alta** em vez de fingir cobertura — é a
      postura certa.
  smoke_dos_consumidores: >
    O @dev não escreveu testes novos para os 6 consumidores migrados, mas a cobertura existe de
    forma mais convincente: `NovaExecucao.test.tsx` (5 pontos) e `FaturamentoEEmissao.test.tsx`
    (2 pontos) selecionam o campo por `getByLabelText('Competência')` e **não foram alterados neste
    commit** — passam contra o `<CampoCompetencia>` novo exatamente como passavam contra o
    `<input>` antigo. Teste inalterado que continua verde depois da troca do componente é evidência
    de não-regressão melhor que teste escrito junto com a mudança.
nfr_validation:
  security:
    status: PASS
    notes: >
      Nenhuma superfície de autenticação/autorização tocada. `normalizarBusca` e `brl` são funções
      puras, sem `dangerouslySetInnerHTML`, sem interpolação em SQL. `brl` no
      `server/gateway/email-gateway.ts` interpola número formatado em HTML de e-mail — mesmo valor
      e mesma posição de antes, sem mudança de superfície. Nota informativa em OBS-122-4 (regex de
      competência do servidor), pré-existente e fora de escopo.
  performance:
    status: PASS
    notes: >
      27 funções locais viraram 3 importadas — bundle levemente menor, não maior. `npm run build`
      exit 0 nas 24 rotas, sem alerta de tamanho. `useId` no `CampoCompetencia` é a API oficial do
      React 18 para id estável em SSR, sem custo de render.
  reliability:
    status: PASS
    notes: >
      Guardas de disparo preservadas (D-5, conferidas no código) e o campo vazio continua tratado.
      A troca por `type="month"` reduz o espaço de entrada inválida em vez de aumentá-lo.
      1164 testes verdes, incluindo toda a suíte de servidor/orquestrador que não foi tocada.
  maintainability:
    status: PASS
    notes: >
      É o objetivo da story e foi entregue com folga. Os três arquivos novos/alterados de `lib/` e
      `ui/` carregam JSDoc que explica **o porquê**, não o quê — inclusive as duas armadilhas que
      custariam meia hora a quem vier depois (o espaço não quebrável do `toLocaleString` e a
      assimetria local/UTC deliberada). O comentário de escopo em `CampoCompetencia` ("nenhuma
      regra de negócio de competência mora aqui — decisão D2-A") protege o componente do próximo
      consumidor com pressa.
debitos_tecnicos_do_epico:
  - id: DEB-12.2-A
    severity: low
    category: requirements
    titulo: "7º campo de competência (filtro) em `RecebiveisManager.tsx:191` está sem dono no épico"
    origem: "Achado fora de escopo do @dev + OBS-122-2 desta revisão"
    avaliacao: >
      Julgamento do @qa: gap **real, pequeno e genuinamente fora do escopo da 12.2** — as ACs 3 e 6
      enumeram 6 pontos e o `[AJUSTE @po]` fechou a lista. O @dev fez o certo em não tocar. O
      problema não é a exclusão, é que o destino apontado (12.18) **não abre esse arquivo**, e
      nenhuma outra story aberta do Épico 12 abre. Sem decisão explícita, o item evapora.
      Impacto se ficar: um `<input>` de texto livre de competência continua existindo em
      `apps/web/src` depois de uma story cujo objetivo declarado era "um único padrão de
      competência"; e os HTTP 400 por competência parcial (pré-existentes) continuam.
      Risco de corrigir: praticamente nulo — contrato de valor idêntico (`AAAA-MM` ou `''`), sem
      persistência, sem mudança de comportamento observável além de deixar de aceitar lixo.
    recomendacao: >
      @po/@sm: acrescentar explicitamente à **12.18** (File List + um AC), assumindo a ampliação de
      escopo, **ou** abrir item de backlog autônomo. Decidir de forma registrada; não herdar do Dev
      Agent Record. **Não abrir story própria só para isso** e **não reabrir a 12.2**.
  - id: DEB-12.2-B
    severity: low
    category: code
    titulo: "`R$ ${toFixed(2)}` na mensagem de `VALOR_ABAIXO_MINIMO` chega à tela"
    origem: "Achado desta revisão (OBS-122-1)"
    recomendacao: >
      **Absorver na 12.13** (dona do "texto do mínimo do gateway"), acrescentando
      `apps/web/src/server/emissao/emitir-boleto.ts` à File List dela. Troca de uma linha para
      `brl()`. Ideal que a 12.13 aproveite e afirme a mensagem num teste, já que ela hoje é o único
      lugar do repo onde os dois formatos de moeda aparecem na mesma frase.
  - id: DEB-12.2-C
    severity: info
    category: requirements
    titulo: "Métrica do épico: 27 duplicações → 4 utilitários (não 11, nem 26)"
    origem: "Achado desta revisão (OBS-122-3)"
    recomendacao: >
      @po/@sm: ao consolidar as métricas de saída do Épico 12, usar **27 → 4**. A auditoria
      (`ux-gaps-emissoes.md`, R-12) diz "4+3+4 = 11" porque só varreu o caminho de emissão, e o
      Dev Agent Record diz "26" por erro de soma. Documentação, sem impacto em código.
impacto_no_sequenciamento: >
  Nenhum bloqueio. **A Fase 0 está fechada**: 12.1 PASS + 12.2 PASS, sem contenção entre elas
  (conferido: `79e4acf` não conflita com `daaa36d`, arquivos e responsabilidades disjuntos onde se
  cruzam). As stories que declaram `[DEP] 12.2` — **12.4, 12.5, 12.9, 12.15, 12.16** — estão
  liberadas para abrir: `<CampoCompetencia>`, `brl()`, `normalizarBusca()` e `competenciaAtual()`
  existem, estão testados e são os únicos padrões vivos no `apps/web/src`. Vale o alerta ao @sm/@dev
  das próximas stories: **qualquer `brl`/`normalizarBusca`/`competenciaAtual` local reintroduzido a
  partir daqui é regressão direta da AC 4 desta story**, e o mesmo vale para `<input>` de texto de
  competência. Os débitos DEB-12.2-A/B/C são todos low/info; A e B precisam de **decisão de
  roteamento do @po** (A não tem dono hoje), mas nenhum deles segura a Fase 1.
